# yamllint disable rule:truthy rule:line-length
---
name: Container Build & Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build & push image to Quay.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: quay.io

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate Quay variables/secrets
        shell: bash
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail

          fail=0

          if [ -z "${QUAY_NAMESPACE:-}" ]; then
            echo "::error::Missing required org/repo variable: vars.QUAY_NAMESPACE"
            fail=1
          fi

          if [ -z "${QUAY_USERNAME:-}" ]; then
            echo "::error::Missing required secret: secrets.QUAY_USERNAME"
            fail=1
          fi

          if [ -z "${QUAY_PASSWORD:-}" ]; then
            echo "::error::Missing required secret: secrets.QUAY_PASSWORD"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "Quay configuration present (namespace + credentials)."

      - name: Compute image name and tags
        shell: bash
        env:
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          image_repo="${repo#container-}"

          image_name="${REGISTRY}/${QUAY_NAMESPACE}/${image_repo}"
          release_tag="${{ github.event.release.tag_name }}"
          version="${release_tag#v}"
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "IMAGE_NAME=${image_name}"
            echo "RELEASE_TAG=${release_tag}"
            echo "VERSION=${version}"
            echo "FULL_SHA=${full_sha}"
            echo "SHORT_SHA=${short_sha}"
            echo "CREATED=${created}"
          } >> "$GITHUB_ENV"

          echo "Using IMAGE_NAME=${image_name}"
          echo "Using RELEASE_TAG=${release_tag}"
          echo "Using VERSION=${version}"
          echo "Using SHORT_SHA=${short_sha}"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log in to Quay.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Build and push image (amd64 + arm64)
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ github.repository }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.FULL_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}

      - name: Verify, scan, sign, and summarize release image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: bash scripts/devtools-container-release-verify.sh

      - name: Generate release evidence
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          set -euo pipefail
          tags="$IMAGE_NAME:$RELEASE_TAG,$IMAGE_NAME:$VERSION,$IMAGE_NAME:sha-$SHORT_SHA,$IMAGE_NAME:latest"
          TESTED_MATRIX="ubuntu-latest,docker-buildx,trivy,release-publish" \
          PASSED_JOBS="Build & push image to Quay.io" \
          BUILT_ARTIFACTS="$IMAGE_NAME@$IMAGE_DIGEST" \
          PUBLISHED_ARTIFACTS="$tags" \
          CONTAINER_IMAGE_TAGS="$tags" \
          QUAY_IMAGE="$IMAGE_NAME@$IMAGE_DIGEST" \
          RELEASE_TAG="$RELEASE_TAG" \
          RELEASE_VERSION="$VERSION" \
          SECURITY_SCAN_RESULT="trivy-completed" \
          python3 scripts/generate-release-evidence.py

      - name: Write release provenance
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/generate-release-provenance.py \
            --mode workflow-release \
            --release-tag "$RELEASE_TAG" \
            --commit "$FULL_SHA" \
            --subject dist/release-evidence.json \
            --subject dist/release-evidence.md \
            --artifact "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Sign release evidence assets
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum release-evidence.json release-evidence.md release-provenance.intoto.jsonl > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: release-evidence
          path: |
            dist/release-evidence.json
            dist/release-evidence.md
            dist/release-provenance.intoto.jsonl
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          if-no-files-found: ignore

  attach-release-evidence:
    name: Attach signed release evidence
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download release evidence artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: release-evidence
          path: dist

      - name: Attach signed release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LITRELEASEBOT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing required secret: secrets.LITRELEASEBOT_TOKEN"
            exit 1
          fi

          if ! gh auth status --hostname github.com >/dev/null 2>&1; then
            echo "::error::secrets.LITRELEASEBOT_TOKEN is not a valid GitHub token"
            exit 1
          fi

          gh release upload "${{ github.event.release.tag_name }}" \
            dist/release-evidence.json \
            dist/release-evidence.md \
            dist/release-provenance.intoto.jsonl \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sigstore.json \
            --clobber

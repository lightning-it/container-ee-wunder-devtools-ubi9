# yamllint disable rule:truthy rule:line-length
---
name: Semantic Release

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: yamllint
        run: bash scripts/wunder-devtools-ee.sh yamllint .github

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git user (bot)
        run: |
          git config user.name "litreleasebot"
          git config user.email "litreleasebot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.LITRELEASEBOT_TOKEN }}
          GH_TOKEN: ${{ secrets.LITRELEASEBOT_TOKEN }}
        run: |
          set -euo pipefail
          public_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          trap 'git remote set-url origin "$public_remote"' EXIT
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npx --yes \
            --package semantic-release@25 \
            --package @semantic-release/commit-analyzer@13 \
            --package @semantic-release/github@12 \
            --package @semantic-release/release-notes-generator@14 \
            --package conventional-changelog-conventionalcommits@10 \
            semantic-release

  release_dry_run:
    name: Semantic Release (dry run)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release (dry run)
        env:
          WUNDER_DEVTOOLS_DOCKER_SOCKET: required
          WUNDER_DEVTOOLS_NETWORK: bridge
          WUNDER_DEVTOOLS_WORKSPACE_MODE: rw
        run: >-
          bash scripts/wunder-devtools-ee.sh
          scripts/devtools-container-ci.sh semantic-release-dry-run

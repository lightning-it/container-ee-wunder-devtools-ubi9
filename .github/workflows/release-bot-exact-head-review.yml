# Managed by lightning-it/shared-assets-lit.
# Do not edit downstream copies directly.
# REP-60 pipeline governance: protected MLX-90 §7.2 Exact-Revision Codex controller.
# yamllint disable rule:truthy rule:line-length
---
name: Protected Exact-Revision Codex review
run-name: >-
  Exact-Revision Codex PR #${{ inputs.pr_number }}
  ${{ inputs.expected_base }}..${{ inputs.expected_head }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Release-App pull request to review
        required: true
        type: number
      base_ref:
        description: Frozen protected pull-request base ref
        required: true
        type: string
      expected_base:
        description: Frozen full pull-request base SHA
        required: true
        type: string
      expected_head:
        description: Frozen full pull-request head SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    exact-revision-codex-${{ github.repository }}-${{ inputs.pr_number }}-${{ inputs.expected_head }}
  cancel-in-progress: false

# The workflow is accepted only as a Release-App-authenticated dispatch from the
# exact protected PR base ref/SHA. Candidate code is never checked out or
# executed. Codex sees one bounded directory containing only immutable metadata,
# the full binary diff, protected prompt, and protected schema.
jobs:
  exact-revision-codex-review:
    name: Current revision review
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'lightning-it-release-automation[bot]'
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      BASE_REF: ${{ inputs.base_ref }}
      DISPATCH_REF: ${{ github.ref }}
      DISPATCH_BASE_SHA: ${{ github.sha }}
      EXPECTED_BASE: ${{ inputs.expected_base }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      PR_NUMBER: ${{ inputs.pr_number }}
      REPOSITORY: ${{ github.repository }}
      TRIGGER: app_dispatch
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Load the complete protected review-asset closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${DISPATCH_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${DISPATCH_BASE_SHA}" = "${EXPECTED_BASE}"
          test "${TRUSTED_WORKFLOW_SHA}" = "${EXPECTED_BASE}"
          test "${TRUSTED_WORKFLOW_SHA}" = "${DISPATCH_BASE_SHA}"
          install -d -m 0700 trusted-controller
          load_protected_asset() {
            local destination path payload
            path="$1"
            destination="$2"
            payload="$(gh api \
              "repos/${REPOSITORY}/contents/${path}?ref=${TRUSTED_WORKFLOW_SHA}")"
            jq -e \
              --arg path "${path}" '
                .type == "file"
                and .path == $path
                and .encoding == "base64"
                and (.content | type == "string" and length > 0)
                and (.size | type == "number" and . > 0 and . <= 1000000)
                and (.sha | type == "string" and test("^[0-9a-f]{40}$"))
              ' <<<"${payload}" >/dev/null
            jq -er .content <<<"${payload}" \
              | base64 --decode >"${destination}"
            test "$(git hash-object "${destination}")" = \
              "$(jq -r .sha <<<"${payload}")"
          }
          load_protected_asset \
            scripts/materialize-exact-revision-review.py \
            trusted-controller/materialize.py
          chmod 0500 trusted-controller/materialize.py
          python3 trusted-controller/materialize.py materialize \
            --repository "${REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --base-ref "${BASE_REF}" \
            --expected-base "${EXPECTED_BASE}" \
            --expected-head "${EXPECTED_HEAD}" \
            --trusted-workflow-sha "${TRUSTED_WORKFLOW_SHA}" \
            --trigger "${TRIGGER}" \
            --dispatch-ref "${DISPATCH_REF}" \
            --review-directory exact-revision-review >/dev/null
          load_protected_asset \
            .github/codex/prompts/review-exact-head.md \
            exact-revision-review/review-prompt.md
          load_protected_asset \
            .github/codex/schemas/exact-head-review.schema.json \
            exact-revision-review/review-schema.json
          load_protected_asset \
            .github/workflows/release-bot-exact-head-review.yml \
            trusted-controller/workflow.yml
          load_protected_asset \
            .github/workflows/current-revision-rerun.yml \
            trusted-controller/current-revision-rerun.yml
          test -s exact-revision-review/review-prompt.md
          jq -e '.type == "object"' exact-revision-review/review-schema.json >/dev/null
          python3 trusted-controller/materialize.py bind-assets \
            --repository "${REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --base-ref "${BASE_REF}" \
            --expected-base "${EXPECTED_BASE}" \
            --expected-head "${EXPECTED_HEAD}" \
            --trusted-workflow-sha "${TRUSTED_WORKFLOW_SHA}" \
            --trigger "${TRIGGER}" \
            --dispatch-ref "${DISPATCH_REF}" \
            --review-directory exact-revision-review \
            --materializer-path trusted-controller/materialize.py \
            --prompt-path exact-revision-review/review-prompt.md \
            --rerun-workflow-path trusted-controller/current-revision-rerun.yml \
            --schema-path exact-revision-review/review-schema.json \
            --workflow-path trusted-controller/workflow.yml >/dev/null
          chmod 0400 \
            exact-revision-review/change.patch \
            exact-revision-review/review-metadata.json \
            exact-revision-review/review-prompt.md \
            exact-revision-review/review-schema.json \
            trusted-controller/current-revision-rerun.yml \
            trusted-controller/workflow.yml

      - name: Reserve one immutable review input or reuse its protected PASS
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          input_sha256="$(jq -er .input_sha256 exact-revision-review/review-metadata.json)"
          external_prefix="mlx90-exact-revision:v4:${input_sha256}:"
          external_id="${external_prefix}${GITHUB_RUN_ID}"
          expected_title="Exact-Revision Codex PR #${PR_NUMBER} ${EXPECTED_BASE}..${EXPECTED_HEAD}"
          read_reservation_checks() {
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${EXPECTED_HEAD}/check-runs?check_name=Protected%20Exact-Revision%20Codex%20result&filter=all&per_page=100"
          }
          create_reservation_once() {
            local title="$1" summary="$2" created recovered recovery_attempt
            if ! created="$(gh api --method POST "repos/${REPOSITORY}/check-runs" \
                -f name='Protected Exact-Revision Codex result' \
                -f head_sha="${EXPECTED_HEAD}" \
                -f status=in_progress \
                -f external_id="${external_id}" \
                -f "output[title]=${title}" \
                -f "output[summary]=${summary}")"; then
              created=''
              for recovery_attempt in $(seq 1 5); do
                echo "Recovering immutable reservation creation outcome (attempt ${recovery_attempt}/5)." >&2
                sleep 5
                if ! recovered="$(read_reservation_checks | jq -c \
                  --arg external_id "${external_id}" \
                  --arg head "${EXPECTED_HEAD}" '
                    [.[].check_runs[]? |
                      select(.name == "Protected Exact-Revision Codex result") |
                      select(.app.id == 15368 and .app.slug == "github-actions") |
                      select(.head_sha == $head and .external_id == $external_id)]')"; then
                  echo "Reservation recovery read failed; retrying read-only reconciliation." >&2
                  continue
                fi
                if [ "$(jq 'length' <<<"${recovered}")" -gt 1 ]; then
                  echo "Ambiguous immutable reservation creation outcome." >&2
                  return 1
                fi
                if [ "$(jq 'length' <<<"${recovered}")" -eq 1 ]; then
                  created="$(jq -c '.[0]' <<<"${recovered}")"
                  break
                fi
              done
              if [ -z "${created}" ]; then
                echo "Reservation creation failed without one materialized exact result." >&2
                return 1
              fi
            fi
            printf '%s' "${created}"
          }
          checks="$(read_reservation_checks)"
          matching="$(jq -c \
            --arg external_prefix "${external_prefix}" \
            '[.[].check_runs[]? |
              select(.name == "Protected Exact-Revision Codex result") |
              select(.app.id == 15368 and .app.slug == "github-actions") |
              select((.external_id // "") | startswith($external_prefix))]' <<<"${checks}")"
          count="$(jq 'length' <<<"${matching}")"
          if [ "${count}" -gt 1 ]; then
            echo "Multiple protected review reservations exist for one immutable input." >&2
            exit 1
          fi
          if [ "${count}" -eq 1 ]; then
            prior_check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${matching}")"
            details_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${prior_check_id}"
            if [ "$(jq -r '.[0].details_url // empty' <<<"${matching}")" != "${details_url}" ]; then
              rebound="$(gh api --method PATCH \
                "repos/${REPOSITORY}/check-runs/${prior_check_id}" \
                -f "details_url=${details_url}")"
              jq -e \
                --arg external_id "$(jq -r '.[0].external_id // empty' <<<"${matching}")" \
                --arg head "${EXPECTED_HEAD}" \
                --arg url "${details_url}" \
                --argjson check_id "${prior_check_id}" '
                  .id == $check_id
                  and .name == "Protected Exact-Revision Codex result"
                  and .app.id == 15368
                  and .app.slug == "github-actions"
                  and .head_sha == $head
                  and .details_url == $url
                  and .external_id == $external_id
                ' <<<"${rebound}" >/dev/null
              checks="$(read_reservation_checks)"
              matching="$(jq -c \
                --arg external_prefix "${external_prefix}" \
                '[.[].check_runs[]? |
                  select(.name == "Protected Exact-Revision Codex result") |
                  select(.app.id == 15368 and .app.slug == "github-actions") |
                  select((.external_id // "") | startswith($external_prefix))]' <<<"${checks}")"
              test "$(jq 'length' <<<"${matching}")" -eq 1
              test "$(jq -er '.[0].id' <<<"${matching}")" -eq "${prior_check_id}"
            fi
            test "$(jq -r '.[0].details_url // empty' <<<"${matching}")" = "${details_url}"
            status="$(jq -r '.[0].status' <<<"${matching}")"
            conclusion="$(jq -r '.[0].conclusion // ""' <<<"${matching}")"
            prior_external_id="$(jq -r '.[0].external_id // empty' <<<"${matching}")"
            prior_run_id="${prior_external_id#"${external_prefix}"}"
            [[ "${prior_run_id}" =~ ^[1-9][0-9]*$ ]]
            test "${prior_external_id}" = "${external_prefix}${prior_run_id}"
            producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${prior_run_id}"
            prior_run="$(gh api "repos/${REPOSITORY}/actions/runs/${prior_run_id}")"
            jq -e \
              --arg actor 'lightning-it-release-automation[bot]' \
              --arg base_ref "${BASE_REF}" \
              --arg base_sha "${EXPECTED_BASE}" \
              --arg run_url "${producer_run_url}" \
              --arg title "${expected_title}" '
                .event == "workflow_dispatch"
                and .head_branch == $base_ref
                and .head_sha == $base_sha
                and .path == ".github/workflows/release-bot-exact-head-review.yml"
                and .display_title == $title
                and .html_url == $run_url
                and .actor.login == $actor
                and .triggering_actor.login == $actor
              ' <<<"${prior_run}" >/dev/null
            if [ "${status}" = in_progress ]; then
              prior_run_status="$(jq -r .status <<<"${prior_run}")"
              prior_run_conclusion="$(jq -r '.conclusion // ""' <<<"${prior_run}")"
              if [ "${prior_run_status}" = completed ]; then
                stale_summary="Immutable input SHA-256: ${input_sha256}. The producer run ${producer_run_url} completed before finalizing its reservation."
                stale="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${prior_check_id}" \
                  -f status=completed \
                  -f conclusion=failure \
                  -f 'output[title]=Protected Exact-Revision Codex review was interrupted' \
                  -f "output[summary]=${stale_summary}")"
                jq -e \
                  --arg external_id "${prior_external_id}" \
                  --arg head "${EXPECTED_HEAD}" \
                  --arg summary "${stale_summary}" \
                  --arg url "${details_url}" \
                  --argjson check_id "${prior_check_id}" '
                    .id == $check_id
                    and .name == "Protected Exact-Revision Codex result"
                    and .app.id == 15368
                    and .app.slug == "github-actions"
                    and .head_sha == $head
                    and .details_url == $url
                    and .external_id == $external_id
                    and .status == "completed"
                    and .conclusion == "failure"
                    and .output.summary == $summary
                  ' <<<"${stale}" >/dev/null
                echo "Closed a stale immutable review reservation because producer run ${prior_run_id} completed/${prior_run_conclusion:-none}." >&2
                exit 1
              fi
              echo "The protected attempt for this immutable input is still active in producer run ${prior_run_id}." >&2
              exit 1
            fi
            if [ "${status}" = completed ] && [ "${conclusion}" = success ]; then
              # Retry only downstream deterministic publication after a
              # protected PASS; never invoke AI again for this input.
              jq -e '.status == "completed"' <<<"${prior_run}" >/dev/null
              jq -e \
                --arg input_sha256 "${input_sha256}" \
                --arg run_url "${producer_run_url}" '
                  .[0].output.summary
                  | fromjson
                  | .input_sha256 == $input_sha256
                    and .run_url == $run_url
                ' <<<"${matching}" >/dev/null
              echo "Reusing the protected PASS for identical input ${input_sha256}."
              {
                echo "reuse=true"
                echo "check_id=$(jq -r '.[0].id' <<<"${matching}")"
                echo "input_sha256=${input_sha256}"
                echo "external_id=${external_id}"
                echo "producer_run_id=${prior_run_id}"
                echo "recovered=false"
              } >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "A prior protected attempt for this immutable input is ${status}/${conclusion:-none}; automatic retry is forbidden." >&2
            exit 1
          fi
          if [ "${GITHUB_RUN_ATTEMPT}" -ne 1 ]; then
            echo "The current workflow run was rerun without a visible immutable reservation; automatic AI retry is forbidden." >&2
            exit 1
          fi
          # GitHub can remove an older custom check from a commit's visible
          # check-run inventory when a pull request is closed and reopened.
          # The protected workflow run and its job/step ledger remain the
          # durable proof that the immutable input already consumed its one AI
          # invocation. Recover that PASS without invoking Codex again.
          base_ref_query="$(jq -rn --arg value "${BASE_REF}" '$value|@uri')"
          run_pages="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/workflows/release-bot-exact-head-review.yml/runs?event=workflow_dispatch&branch=${base_ref_query}&per_page=100")"
          prior_runs="$(jq -c \
            --arg actor 'lightning-it-release-automation[bot]' \
            --arg base_ref "${BASE_REF}" \
            --arg base_sha "${EXPECTED_BASE}" \
            --arg title "${expected_title}" \
            --argjson current_run_id "${GITHUB_RUN_ID}" '
              [.[].workflow_runs[]? |
                select(.id != $current_run_id) |
                select(.event == "workflow_dispatch") |
                select(.head_branch == $base_ref and .head_sha == $base_sha) |
                select(.path == ".github/workflows/release-bot-exact-head-review.yml") |
                select(.display_title == $title) |
                select(.actor.login == $actor and .triggering_actor.login == $actor)] |
              unique_by(.id)
            ' <<<"${run_pages}")"
          prior_run_count="$(jq 'length' <<<"${prior_runs}")"
          if [ "${prior_run_count}" -gt 0 ]; then
            attempts='[]'
            while IFS= read -r prior_run; do
              prior_run_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${prior_run}")"
              job_pages="$(gh api --paginate --slurp \
                "repos/${REPOSITORY}/actions/runs/${prior_run_id}/jobs?filter=all&per_page=100")"
              review_jobs="$(jq -c \
                '[.[].jobs[]? | select(.name == "Current revision review")]' \
                <<<"${job_pages}")"
              test "$(jq 'length' <<<"${review_jobs}")" -eq 1
              review_job="$(jq -c '.[0]' <<<"${review_jobs}")"
              codex_steps="$(jq -c \
                '[.steps[]? | select(.name == "Run protected history-free Exact-Revision Codex review")]' \
                <<<"${review_job}")"
              test "$(jq 'length' <<<"${codex_steps}")" -eq 1
              enforcement_steps="$(jq -c \
                '[.steps[]? | select(.name == "Re-prove exact revision and enforce the Codex verdict")]' \
                <<<"${review_job}")"
              test "$(jq 'length' <<<"${enforcement_steps}")" -eq 1
              attempt="$(jq -cn \
                --arg run_conclusion "$(jq -r '.conclusion // ""' <<<"${prior_run}")" \
                --arg run_status "$(jq -r .status <<<"${prior_run}")" \
                --arg job_conclusion "$(jq -r '.conclusion // ""' <<<"${review_job}")" \
                --arg codex_conclusion "$(jq -r '.[0].conclusion // ""' <<<"${codex_steps}")" \
                --arg enforcement_conclusion "$(jq -r '.[0].conclusion // ""' <<<"${enforcement_steps}")" \
                --argjson run_id "${prior_run_id}" \
                '{run_id:$run_id,run_status:$run_status,run_conclusion:$run_conclusion,
                  job_conclusion:$job_conclusion,codex_conclusion:$codex_conclusion,
                  enforcement_conclusion:$enforcement_conclusion}')"
              attempts="$(jq -cn \
                --argjson attempts "${attempts}" \
                --argjson attempt "${attempt}" \
                '$attempts + [$attempt]')"
            done < <(jq -c '.[]' <<<"${prior_runs}")
            actual_attempts="$(jq -c \
              '[.[] | select(.codex_conclusion != "" and .codex_conclusion != "skipped")]' \
              <<<"${attempts}")"
            if [ "$(jq 'length' <<<"${actual_attempts}")" -ne 1 ]; then
              echo "The durable workflow ledger does not contain exactly one protected AI invocation for this immutable input." >&2
              exit 1
            fi
            successful_attempts="$(jq -c \
              '[.[] | select(
                .run_status == "completed" and
                .run_conclusion == "success" and
                .job_conclusion == "success" and
                .codex_conclusion == "success" and
                .enforcement_conclusion == "success"
              )]' <<<"${actual_attempts}")"
            if [ "$(jq 'length' <<<"${successful_attempts}")" -ne 1 ]; then
              echo "The sole durable protected AI invocation did not pass; automatic retry is forbidden." >&2
              exit 1
            fi
            prior_run_id="$(jq -er '.[0].run_id | select(type == "number" and . > 0)' \
              <<<"${successful_attempts}")"
            external_id="${external_prefix}${prior_run_id}"
            reservation="$(create_reservation_once \
              'Recovering durable protected Exact-Revision Codex PASS' \
              "Immutable input SHA-256: ${input_sha256}. Durable producer run: ${prior_run_id}.")"
            check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${reservation}")"
            {
              echo "reuse=true"
              echo "check_id=${check_id}"
              echo "input_sha256=${input_sha256}"
              echo "external_id=${external_id}"
              echo "producer_run_id=${prior_run_id}"
              echo "recovered=true"
            } >>"${GITHUB_OUTPUT}"
            check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${check_id}" \
              -f "details_url=${check_url}")"
            jq -e \
              --arg external_id "${external_id}" \
              --arg head "${EXPECTED_HEAD}" \
              --arg url "${check_url}" \
              --argjson check_id "${check_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "in_progress"
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
            echo "Recovering the durable protected PASS from producer run ${prior_run_id}; Codex will not run again."
            exit 0
          fi
          reservation="$(create_reservation_once \
            'Protected Exact-Revision Codex review in progress' \
            "Immutable input SHA-256: ${input_sha256}.")"
          check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${reservation}")"
          {
            echo "reuse=false"
            echo "check_id=${check_id}"
            echo "input_sha256=${input_sha256}"
            echo "external_id=${external_id}"
            echo "producer_run_id=${GITHUB_RUN_ID}"
            echo "recovered=false"
          } >>"${GITHUB_OUTPUT}"
          check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
          reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${check_id}" \
            -f "details_url=${check_url}")"
          jq -e \
            --arg external_id "${external_id}" \
            --arg head "${EXPECTED_HEAD}" \
            --arg url "${check_url}" \
            --argjson check_id "${check_id}" '
              .id == $check_id
              and .head_sha == $head
              and .details_url == $url
              and .external_id == $external_id
              and .status == "in_progress"
              and .app.id == 15368
              and .app.slug == "github-actions"
            ' <<<"${reservation}" >/dev/null

      - name: Reserve neutral result before protected review
        id: neutral
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ steps.dedupe.outputs.producer_run_id }}
          REUSE_PROTECTED_PASS: ${{ steps.dedupe.outputs.reuse }}
        run: |
          set -euo pipefail
          input_sha256="$(jq -er .input_sha256 exact-revision-review/review-metadata.json)"
          [[ "${PRODUCER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          external_id="mlx90-current-revision:v4:${PRODUCER_RUN_ID}:${input_sha256}"
          echo "external_id=${external_id}" >>"${GITHUB_OUTPUT}"
          summary="$(jq -cn \
            --arg head "${EXPECTED_HEAD}" \
            --arg input_sha256 "${input_sha256}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson producer_run_id "${PRODUCER_RUN_ID}" \
            '{schema:"rep60-neutral-reservation/v1",head_sha:$head,
              input_sha256:$input_sha256,pull_request_number:$pr_number,
              producer_run_id:$producer_run_id}')"
          read_neutral_checks() {
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${EXPECTED_HEAD}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100"
          }
          api_patch() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api --method PATCH "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "GitHub API patch failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          neutral_checks="$(read_neutral_checks)"
          matching="$(jq -c \
            --arg head "${EXPECTED_HEAD}" '
              [.[].check_runs[]? |
                select(.name == "Current revision review") |
                select(.app.id == 15368 and .app.slug == "github-actions") |
                select(.head_sha == $head)]
            ' <<<"${neutral_checks}")"
          count="$(jq 'length' <<<"${matching}")"
          if [ "${count}" -gt 1 ]; then
            echo "Multiple neutral reservations exist for this head." >&2
            exit 1
          fi
          if [ "${count}" -eq 1 ]; then
            check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${matching}")"
            echo "check_id=${check_id}" >>"${GITHUB_OUTPUT}"
            check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
            jq -e \
              --arg external_id "${external_id}" \
              --arg head "${EXPECTED_HEAD}" \
              --argjson check_id "${check_id}" '
                .[0].id == $check_id
                and .[0].name == "Current revision review"
                and .[0].app.id == 15368
                and .[0].app.slug == "github-actions"
                and .[0].head_sha == $head
                and .[0].external_id == $external_id
                and (.[0].status == "in_progress" or .[0].status == "completed")
              ' <<<"${matching}" >/dev/null
            repaired="$(api_patch "repos/${REPOSITORY}/check-runs/${check_id}" \
              -f "details_url=${check_url}")"
            status="$(jq -er '.status | select(type == "string")' <<<"${repaired}")"
            conclusion="$(jq -r '.conclusion // ""' <<<"${repaired}")"
            if [ "${status}" = completed ] && [ "${conclusion}" = failure ]; then
              test "${REUSE_PROTECTED_PASS}" = true
            elif [ "${status}" = completed ]; then
              test "${conclusion}" = success
            else
              test "${status}" = in_progress
            fi
            jq -e \
              --arg external_id "${external_id}" \
              --arg head "${EXPECTED_HEAD}" \
              --arg url "${check_url}" \
              --argjson check_id "${check_id}" '
                .id == $check_id
                and .name == "Current revision review"
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and (.status == "in_progress" or .status == "completed")
              ' <<<"${repaired}" >/dev/null
            exit 0
          fi
          created=''
          if ! created="$(gh api --method POST "repos/${REPOSITORY}/check-runs" \
              -f name='Current revision review' \
              -f head_sha="${EXPECTED_HEAD}" \
              -f status=in_progress \
              -f external_id="${external_id}" \
              -f 'output[title]=Protected neutral result reserved before review' \
              -f "output[summary]=${summary}")"; then
            for recovery_attempt in $(seq 1 5); do
              echo "Recovering neutral reservation creation outcome (attempt ${recovery_attempt}/5)." >&2
              sleep 5
              if ! neutral_checks="$(read_neutral_checks)"; then
                echo "Neutral reservation recovery read failed; continuing bounded recovery." >&2
                continue
              fi
              recovered="$(jq -c \
                --arg external_id "${external_id}" \
                --arg head "${EXPECTED_HEAD}" '
                  [.[].check_runs[]? |
                    select(.name == "Current revision review") |
                    select(.app.id == 15368 and .app.slug == "github-actions") |
                    select(.head_sha == $head and .external_id == $external_id)]
                ' <<<"${neutral_checks}")"
              if [ "$(jq 'length' <<<"${recovered}")" -gt 1 ]; then
                echo "Ambiguous neutral reservation creation outcome." >&2
                exit 1
              fi
              if [ "$(jq 'length' <<<"${recovered}")" -eq 1 ]; then
                created="$(jq -c '.[0]' <<<"${recovered}")"
                break
              fi
            done
            if [ -z "${created}" ]; then
              echo "Neutral reservation creation failed without one materialized exact result." >&2
              exit 1
            fi
          fi
          check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${created}")"
          {
            echo "check_id=${check_id}"
          } >>"${GITHUB_OUTPUT}"
          check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
          created="$(api_patch "repos/${REPOSITORY}/check-runs/${check_id}" \
            -f "details_url=${check_url}")"
          jq -e \
            --arg external_id "${external_id}" \
            --arg head "${EXPECTED_HEAD}" \
            --arg summary "${summary}" \
            --arg url "${check_url}" \
            --argjson check_id "${check_id}" '
              .id == $check_id
              and .name == "Current revision review"
              and .app.id == 15368
              and .app.slug == "github-actions"
              and .head_sha == $head
              and .details_url == $url
              and .external_id == $external_id
              and .status == "in_progress"
              and .output.summary == $summary
            ' <<<"${created}" >/dev/null

      - name: Run protected history-free Exact-Revision Codex review
        if: steps.dedupe.outputs.reuse != 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: exact-revision-review/review-prompt.md
          output-file: exact-revision-review/result.json
          output-schema-file: exact-revision-review/review-schema.json
          working-directory: exact-revision-review
          permission-profile: :read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          allow-bots: "true"
          allow-bot-users: lightning-it-release-automation

      - name: Re-prove exact revision and enforce the Codex verdict
        env:
          GH_TOKEN: ${{ github.token }}
          NEUTRAL_CHECK_ID: ${{ steps.neutral.outputs.check_id }}
          EXPECTED_NEUTRAL_EXTERNAL_ID: ${{ steps.neutral.outputs.external_id }}
        run: |
          set -euo pipefail
          api_patch() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api --method PATCH "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Idempotent GitHub check update failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          python3 trusted-controller/materialize.py verify \
            --repository "${REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --base-ref "${BASE_REF}" \
            --expected-base "${EXPECTED_BASE}" \
            --expected-head "${EXPECTED_HEAD}" \
            --trusted-workflow-sha "${TRUSTED_WORKFLOW_SHA}" \
            --trigger "${TRIGGER}" \
            --dispatch-ref "${DISPATCH_REF}" \
            --review-directory exact-revision-review \
            --materializer-path trusted-controller/materialize.py \
            --prompt-path exact-revision-review/review-prompt.md \
            --rerun-workflow-path trusted-controller/current-revision-rerun.yml \
            --schema-path exact-revision-review/review-schema.json \
            --workflow-path trusted-controller/workflow.yml >/dev/null
          metadata=exact-revision-review/review-metadata.json
          verdict=PASS
          findings=0
          if [ "${{ steps.dedupe.outputs.reuse }}" != 'true' ]; then
            result=exact-revision-review/result.json
            jq -e \
              --slurpfile metadata "${metadata}" \
              '. as $result | $metadata[0] as $bound |
               ($result.base_sha == $bound.base_sha) and
               ($result.head_sha == $bound.head_sha) and
               ($result.merge_base_sha == $bound.merge_base_sha) and
               ($result.integration_tree_sha == $bound.integration_tree_sha) and
               ($result.diff_sha256 == $bound.diff_sha256) and
               ($result.input_sha256 == $bound.input_sha256) and
               (($result.verdict == "PASS" and ($result.findings | length) == 0) or
                ($result.verdict == "FAIL" and ($result.findings | length) > 0))' \
              "${result}" >/dev/null
            verdict="$(jq -r .verdict "${result}")"
            findings="$(jq '.findings | length' "${result}")"
          fi
          base_sha="$(jq -r .base_sha "${metadata}")"
          head_sha="$(jq -r .head_sha "${metadata}")"
          merge_base_sha="$(jq -r .merge_base_sha "${metadata}")"
          integration_tree_sha="$(jq -r .integration_tree_sha "${metadata}")"
          diff_sha256="$(jq -r .diff_sha256 "${metadata}")"
          input_sha256="$(jq -r .input_sha256 "${metadata}")"
          review_bytes="$(jq -r .review_bytes "${metadata}")"
          producer_run_id="${{ steps.dedupe.outputs.producer_run_id }}"
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${producer_run_id}" =~ ^[1-9][0-9]*$ ]]
          producer_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}"
          evidence="$(jq -cn \
            --arg base "${base_sha}" \
            --arg head "${head_sha}" \
            --arg merge_base "${merge_base_sha}" \
            --arg integration_tree "${integration_tree_sha}" \
            --arg diff_sha256 "${diff_sha256}" \
            --arg input_sha256 "${input_sha256}" \
            --arg workflow_sha "${TRUSTED_WORKFLOW_SHA}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson run_id "${producer_run_id}" \
            --arg run_url "${producer_run_url}" \
            '{schema:4,base_sha:$base,head_sha:$head,merge_base_sha:$merge_base,
              integration_tree_sha:$integration_tree,diff_sha256:$diff_sha256,
              input_sha256:$input_sha256,workflow_sha:$workflow_sha,
              pull_request_number:$pr_number,producer_run_id:$run_id,
              run_url:$run_url}')"
          {
            echo "### Protected Exact-Revision Codex review"
            echo
            echo "- Reviewer path: \`MLX-90 §7.2 Exact-Revision Codex exception\`"
            echo "- Base: \`${base_sha}\`"
            echo "- Head: \`${head_sha}\`"
            echo "- Merge base: \`${merge_base_sha}\`"
            echo "- Integration tree: \`${integration_tree_sha}\`"
            echo "- Full diff SHA-256: \`${diff_sha256}\` (${review_bytes} bytes)"
            echo "- Complete input SHA-256: \`${input_sha256}\`"
            echo "- Verdict: \`${verdict}\`"
            echo "- Findings: \`${findings}\`"
            echo "- Producer run: \`${producer_run_url}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
          if [ "${{ steps.dedupe.outputs.reuse }}" != 'true' ] || \
             [ "${{ steps.dedupe.outputs.recovered }}" = 'true' ]; then
            conclusion=failure
            title='Protected Exact-Revision Codex review failed'
            if [ "${{ steps.dedupe.outputs.recovered }}" = 'true' ]; then
              conclusion=success
              title='Protected Exact-Revision Codex review PASS recovered from durable workflow ledger'
            elif [ "${verdict}" = PASS ] && [ "${findings}" -eq 0 ]; then
              conclusion=success
              title='Protected Exact-Revision Codex review passed'
            fi
            api_patch "repos/${REPOSITORY}/check-runs/${{ steps.dedupe.outputs.check_id }}" \
              -f status=completed \
              -f conclusion="${conclusion}" \
              -f "output[title]=${title}" \
              -f "output[summary]=${evidence}" >/dev/null
            finalized=''
            for publication_attempt in $(seq 1 5); do
              if finalized="$(gh api \
                  "repos/${REPOSITORY}/check-runs/${{ steps.dedupe.outputs.check_id }}")" && \
                jq -e \
                  --arg conclusion "${conclusion}" \
                  --arg evidence "${evidence}" \
                  --arg head "${EXPECTED_HEAD}" \
                  --argjson check_id "${{ steps.dedupe.outputs.check_id }}" '
                    .id == $check_id
                    and .name == "Protected Exact-Revision Codex result"
                    and .app.id == 15368
                    and .app.slug == "github-actions"
                    and .head_sha == $head
                    and .status == "completed"
                    and .conclusion == $conclusion
                    and .output.summary == $evidence
                  ' <<<"${finalized}" >/dev/null; then
                break
              fi
              finalized=''
              if [ "${publication_attempt}" -lt 5 ]; then
                sleep 2
              fi
            done
            test -n "${finalized}"
            test "${conclusion}" = success
          fi
          [[ "${NEUTRAL_CHECK_ID}" =~ ^[1-9][0-9]*$ ]]
          expected_neutral_external_id="mlx90-current-revision:v4:${producer_run_id}:${input_sha256}"
          test "${EXPECTED_NEUTRAL_EXTERNAL_ID}" = "${expected_neutral_external_id}"
          neutral_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${NEUTRAL_CHECK_ID}"
          api_patch \
            "repos/${REPOSITORY}/check-runs/${NEUTRAL_CHECK_ID}" \
            -f status=completed \
            -f conclusion=success \
            -f "details_url=${neutral_url}" \
            -f "external_id=${expected_neutral_external_id}" \
            -f 'output[title]=Protected Exact-Revision Codex review passed' \
            -f "output[summary]=${evidence}" >/dev/null
          neutral=''
          completed_at=''
          for publication_attempt in $(seq 1 5); do
            if neutral="$(gh api \
                "repos/${REPOSITORY}/check-runs/${NEUTRAL_CHECK_ID}")" && \
              completed_at="$(jq -er '
                .completed_at
                | select(type == "string")
                | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
                ' <<<"${neutral}")" && \
              jq -e \
                --arg completed_at "${completed_at}" \
                --arg evidence "${evidence}" \
                --arg external_id "${expected_neutral_external_id}" \
                --arg head "${EXPECTED_HEAD}" \
                --arg url "${neutral_url}" \
                --argjson check_id "${NEUTRAL_CHECK_ID}" '
                  .id == $check_id
                  and .name == "Current revision review"
                  and .app.id == 15368
                  and .app.slug == "github-actions"
                  and .head_sha == $head
                  and .details_url == $url
                  and .external_id == $external_id
                  and .completed_at == $completed_at
                  and .status == "completed"
                  and .conclusion == "success"
                  and .output.summary == $evidence
                ' <<<"${neutral}" >/dev/null; then
              break
            fi
            neutral=''
            completed_at=''
            if [ "${publication_attempt}" -lt 5 ]; then
              sleep 2
            fi
          done
          test -n "${neutral}"
          test -n "${completed_at}"

      - name: Fail-close an unfinished protected reservation
        if: >-
          always() &&
          (steps.dedupe.outputs.reuse != 'true' ||
            steps.dedupe.outputs.recovered == 'true') &&
          steps.dedupe.outputs.check_id != ''
        env:
          CHECK_ID: ${{ steps.dedupe.outputs.check_id }}
          EXPECTED_EXTERNAL_ID: ${{ steps.dedupe.outputs.external_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_read() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "GitHub API read failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          api_patch() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api --method PATCH "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "GitHub API patch failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          [[ "${CHECK_ID}" =~ ^[1-9][0-9]*$ ]]
          reservation="$(api_read "repos/${REPOSITORY}/check-runs/${CHECK_ID}")"
          jq -e \
            --arg external_id "${EXPECTED_EXTERNAL_ID}" \
            --arg head "${EXPECTED_HEAD}" \
            --argjson check_id "${CHECK_ID}" '
              .id == $check_id
              and .name == "Protected Exact-Revision Codex result"
              and .app.id == 15368
              and .app.slug == "github-actions"
              and .head_sha == $head
              and .external_id == $external_id
              and (.status == "in_progress" or .status == "completed")
            ' <<<"${reservation}" >/dev/null
          if [ "$(jq -r .status <<<"${reservation}")" = completed ]; then
            jq -e '.conclusion == "success" or .conclusion == "failure"' \
              <<<"${reservation}" >/dev/null
            exit 0
          fi
          failure_evidence="The protected producer run ${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ended before finalizing this immutable reservation."
          reservation="$(api_patch \
            "repos/${REPOSITORY}/check-runs/${CHECK_ID}" \
            -f status=completed \
            -f conclusion=failure \
            -f 'output[title]=Protected Exact-Revision Codex review failed closed' \
            -f "output[summary]=${failure_evidence}")"
          jq -e \
            --arg external_id "${EXPECTED_EXTERNAL_ID}" \
            --arg head "${EXPECTED_HEAD}" \
            --argjson check_id "${CHECK_ID}" '
              .id == $check_id
              and .name == "Protected Exact-Revision Codex result"
              and .app.id == 15368
              and .app.slug == "github-actions"
              and .head_sha == $head
              and .external_id == $external_id
              and .status == "completed"
              and .conclusion == "failure"
            ' <<<"${reservation}" >/dev/null

      - name: Fail-close an unfinished neutral reservation
        if: always() && steps.neutral.outputs.external_id != ''
        env:
          CHECK_ID: ${{ steps.neutral.outputs.check_id }}
          EXPECTED_EXTERNAL_ID: ${{ steps.neutral.outputs.external_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_read() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "GitHub API read failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          api_patch() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api --method PATCH "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "GitHub API patch failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          [[ "${EXPECTED_EXTERNAL_ID}" =~ ^mlx90-current-revision:v4:[1-9][0-9]*:[0-9a-f]{64}$ ]]
          check_id="${CHECK_ID}"
          if [ -n "${check_id}" ]; then
            [[ "${check_id}" =~ ^[1-9][0-9]*$ ]]
          else
            successful_discovery_reads=0
            for discovery_attempt in $(seq 1 5); do
              if neutral_pages="$(gh api --paginate --slurp \
                  "repos/${REPOSITORY}/commits/${EXPECTED_HEAD}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"; then
                successful_discovery_reads=$((successful_discovery_reads + 1))
                discovered="$(jq -c \
                  --arg external_id "${EXPECTED_EXTERNAL_ID}" \
                  --arg head "${EXPECTED_HEAD}" '
                    [.[].check_runs[]? |
                      select(.name == "Current revision review") |
                      select(.app.id == 15368 and .app.slug == "github-actions") |
                      select(.head_sha == $head and .external_id == $external_id)]
                  ' <<<"${neutral_pages}")"
                discovered_count="$(jq 'length' <<<"${discovered}")"
                if [ "${discovered_count}" -gt 1 ]; then
                  echo "Multiple exact neutral reservations were discovered during cleanup." >&2
                  exit 1
                fi
                if [ "${discovered_count}" -eq 1 ]; then
                  check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' \
                    <<<"${discovered}")"
                  break
                fi
              else
                echo "Neutral cleanup discovery read failed (attempt ${discovery_attempt}/5)." >&2
              fi
              if [ "${discovery_attempt}" -lt 5 ]; then
                sleep 5
              fi
            done
            if [ -z "${check_id}" ]; then
              if [ "${successful_discovery_reads}" -eq 0 ]; then
                echo "Neutral cleanup could not observe GitHub after five attempts." >&2
                exit 1
              fi
              echo "No materialized exact neutral reservation requires cleanup."
              exit 0
            fi
          fi
          reservation="$(api_read "repos/${REPOSITORY}/check-runs/${check_id}")"
          jq -e \
            --arg external_id "${EXPECTED_EXTERNAL_ID}" \
            --arg head "${EXPECTED_HEAD}" \
            --argjson check_id "${check_id}" '
              .id == $check_id
              and .name == "Current revision review"
              and .app.id == 15368
              and .app.slug == "github-actions"
              and .head_sha == $head
              and .external_id == $external_id
              and (.status == "in_progress" or .status == "completed")
            ' <<<"${reservation}" >/dev/null
          if [ "$(jq -r .status <<<"${reservation}")" = completed ]; then
            jq -e '.conclusion == "success" or .conclusion == "failure"' \
              <<<"${reservation}" >/dev/null
            exit 0
          fi
          failure_evidence="The protected producer run ${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID} ended before finalizing this pre-reserved neutral result."
          reservation="$(api_patch \
            "repos/${REPOSITORY}/check-runs/${check_id}" \
            -f status=completed \
            -f conclusion=failure \
            -f 'output[title]=Protected neutral result failed closed' \
            -f "output[summary]=${failure_evidence}")"
          jq -e \
            --arg external_id "${EXPECTED_EXTERNAL_ID}" \
            --arg head "${EXPECTED_HEAD}" \
            --argjson check_id "${check_id}" '
              .id == $check_id
              and .name == "Current revision review"
              and .app.id == 15368
              and .app.slug == "github-actions"
              and .head_sha == $head
              and .external_id == $external_id
              and .status == "completed"
              and .conclusion == "failure"
            ' <<<"${reservation}" >/dev/null

  request-protected-verifier-reevaluation:
    name: Request protected verifier re-evaluation
    needs: exact-revision-codex-review
    if: needs.exact-revision-codex-review.result == 'success'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch the protected re-evaluation helper from the exact base
        env:
          BASE_REF: ${{ inputs.base_ref }}
          EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${BASE_REF}" =~ ^(develop|main)$ ]]
          [[ "${EXPECTED_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PRODUCER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EXECUTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${EXECUTED_WORKFLOW_SHA}" = "${EXPECTED_BASE}"
          test "${GITHUB_REF}" = "refs/heads/${BASE_REF}"
          test "${GITHUB_REF_PROTECTED}" = true
          live_base="$(gh api \
            "repos/${REPOSITORY}/branches/${BASE_REF}" --jq .commit.sha)"
          test "${live_base}" = "${EXPECTED_BASE}"
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/current-revision-rerun.yml/dispatches" \
            -f "ref=${BASE_REF}" \
            -f "inputs[base_ref]=${BASE_REF}" \
            -f "inputs[pr_number]=${PR_NUMBER}" \
            -f "inputs[expected_base]=${EXPECTED_BASE}" \
            -f "inputs[expected_head]=${EXPECTED_HEAD}" \
            -f "inputs[producer_run_id]=${PRODUCER_RUN_ID}" >/dev/null
          expected_title="Protected verifier handoff PR #${PR_NUMBER} producer ${PRODUCER_RUN_ID} head ${EXPECTED_HEAD}"
          handoff=''
          for observation_attempt in $(seq 1 20); do
            runs="$(gh api \
              "repos/${REPOSITORY}/actions/workflows/current-revision-rerun.yml/runs?event=workflow_dispatch&branch=${BASE_REF}&per_page=100")"
            candidates="$(jq -c \
              --arg actor 'github-actions[bot]' \
              --arg base_ref "${BASE_REF}" \
              --arg title "${expected_title}" '
                [.workflow_runs[] |
                  select(.event == "workflow_dispatch") |
                  select(.path == ".github/workflows/current-revision-rerun.yml") |
                  select(.display_title == $title) |
                  select(.head_branch == $base_ref) |
                  select(.actor.login == $actor and .triggering_actor.login == $actor)]
              ' <<<"${runs}")"
            test "$(jq 'length' <<<"${candidates}")" -le 1
            if [ "$(jq 'length' <<<"${candidates}")" -eq 1 ]; then
              handoff="$(jq -c '.[0]' <<<"${candidates}")"
              break
            fi
            if [ "${observation_attempt}" -eq 20 ]; then
              echo "The protected handoff run was not materialized in time." >&2
              exit 1
            fi
            sleep 3
          done
          jq -e \
            --arg base "${EXPECTED_BASE}" \
            --arg base_ref "${BASE_REF}" \
            --arg repository "${REPOSITORY}" '
              .head_sha == $base
              and .head_branch == $base_ref
              and .repository.full_name == $repository
              and (.status == "queued" or .status == "in_progress" or .status == "completed")
            ' <<<"${handoff}" >/dev/null
          handoff_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${handoff}")"
          job=''
          for job_attempt in $(seq 1 20); do
            jobs="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${handoff_id}/jobs?filter=all&per_page=100")"
            materialized="$(jq -c '
              [.jobs[] |
                select(.name == "Re-run the one protected verifier attempt")]
            ' <<<"${jobs}")"
            test "$(jq 'length' <<<"${materialized}")" -le 1
            if [ "$(jq 'length' <<<"${materialized}")" -eq 1 ]; then
              job="$(jq -c '.[0]' <<<"${materialized}")"
              break
            fi
            if [ "${job_attempt}" -eq 20 ]; then
              echo "The exact protected handoff job was not materialized in time." >&2
              exit 1
            fi
            sleep 3
          done
          jq -e \
            --arg base "${EXPECTED_BASE}" '
              .head_sha == $base
              and .run_attempt == 1
              and (.status == "queued" or .status == "in_progress" or .status == "completed")
            ' <<<"${job}" >/dev/null

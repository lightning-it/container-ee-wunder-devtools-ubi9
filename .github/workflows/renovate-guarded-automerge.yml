# yamllint disable rule:truthy rule:line-length
---
name: Renovate guarded automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-trusted-renovate-automerge:
    name: Enable auto-merge for trusted Renovate PR
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Verify Renovate PR identity
        id: guard
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TRIGGER_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          renovate_owns_head() {
            local author commits committer expected_head last_sha reason sha verified
            expected_head="$1"
            commits="$(
              gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[] | [.sha, (.author.login // ""), (.committer.login // ""), (.commit.verification.verified | tostring), (.commit.verification.reason // "")] | @tsv'
            )" || return 1
            [ -n "$commits" ] || return 1
            last_sha=""
            while IFS=$'\t' read -r sha author committer verified reason; do
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              [ "$author" = "renovate[bot]" ] || return 1
              [ "$committer" = "web-flow" ] || return 1
              [ "$verified" = "true" ] || return 1
              [ "$reason" = "valid" ] || return 1
              last_sha="$sha"
            done <<<"$commits"
            [ "$last_sha" = "$expected_head" ]
          }

          labels="$(jq -r '.[]' <<<"$PR_LABELS")"

          has_label() {
            grep -Fxq "$1" <<<"$labels"
          }

          trusted=true

          live_pr="{}"
          if ! live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"; then
            trusted=false
          fi
          if ! jq -e \
            --arg author "$PR_AUTHOR" \
            --arg base "$PR_BASE" \
            --arg head "$PR_HEAD" \
            --arg head_sha "$PR_HEAD_SHA" \
            --arg repo "$REPO" \
            '(.state == "open") and (.draft == false)
             and (.user.login == $author) and (.base.ref == $base)
             and (.head.ref == $head) and (.head.sha == $head_sha)
             and (.head.repo.full_name == $repo)
             and ([.labels[].name] | index("renovate") != null)
             and ([.labels[].name] | index("dependencies") != null)
             and ([.labels[].name] | index("safe-automerge") != null)
             and ([.labels[].name] | index("breaking-update") == null)' \
            >/dev/null <<<"$live_pr"; then
            trusted=false
          fi
          if ! renovate_owns_head "$PR_HEAD_SHA"; then
            trusted=false
          fi

          if [ "$PR_DRAFT" != "false" ]; then
            trusted=false
          fi

          if [ "$TRIGGER_ACTOR" != "renovate[bot]" ]; then
            trusted=false
          fi

          if [ "$PR_AUTHOR" != "renovate[bot]" ]; then
            trusted=false
          fi

          case "$PR_HEAD" in
            renovate/*) ;;
            *) trusted=false ;;
          esac

          if [ "$PR_BASE" != "develop" ]; then
            trusted=false
          fi

          if ! has_label renovate || ! has_label dependencies \
            || ! has_label safe-automerge || has_label breaking-update; then
            trusted=false
          fi

          label_events=""
          if ! label_events="$(
            gh api --paginate \
              "repos/${REPO}/issues/${PR_NUMBER}/events?per_page=100" \
              --jq '.[] | [.event, (.label.name // ""), (.actor.login // "")] | @tsv'
          )"; then
            trusted=false
          fi
          safe_event="$(
            awk -F '\t' \
              '$2 == "safe-automerge" && ($1 == "labeled" || $1 == "unlabeled") { latest=$0 } END { print latest }' \
              <<<"$label_events"
          )"
          expected_safe_event=$'labeled\tsafe-automerge\trenovate[bot]'
          breaking_event_pattern=$'labeled\tbreaking-update\t'
          if [ "$safe_event" != "$expected_safe_event" ]; then
            trusted=false
          fi
          if grep -Fq "$breaking_event_pattern" <<<"$label_events"; then
            trusted=false
          fi

          echo "trusted=$trusted" >>"$GITHUB_OUTPUT"

      - name: Revoke auto-merge for an untrusted state or event
        if: steps.guard.outputs.trusted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          renovate_owns_head() {
            local author commits committer expected_head last_sha reason sha verified
            expected_head="$1"
            commits="$(
              gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[] | [.sha, (.author.login // ""), (.committer.login // ""), (.commit.verification.verified | tostring), (.commit.verification.reason // "")] | @tsv'
            )" || return 1
            [ -n "$commits" ] || return 1
            last_sha=""
            while IFS=$'\t' read -r sha author committer verified reason; do
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              [ "$author" = "renovate[bot]" ] || return 1
              [ "$committer" = "web-flow" ] || return 1
              [ "$verified" = "true" ] || return 1
              [ "$reason" = "valid" ] || return 1
              last_sha="$sha"
            done <<<"$commits"
            [ "$last_sha" = "$expected_head" ]
          }

          current_live_is_safe() {
            local breaking_event_pattern expected_safe_event label_events live_head_sha live_pr safe_event
            if ! live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"; then
              return 1
            fi
            if ! jq -e \
              --arg repo "$REPO" \
              '(.state == "open") and (.draft == false)
               and (.user.login == "renovate[bot]")
               and (.base.ref == "develop")
               and (.head.ref | startswith("renovate/"))
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("renovate") != null)
               and ([.labels[].name] | index("dependencies") != null)
               and ([.labels[].name] | index("safe-automerge") != null)
               and ([.labels[].name] | index("breaking-update") == null)' \
              >/dev/null <<<"$live_pr"; then
              return 1
            fi
            live_head_sha="$(jq -r '.head.sha' <<<"$live_pr")"
            if ! renovate_owns_head "$live_head_sha"; then
              return 1
            fi
            if ! label_events="$(
              gh api --paginate \
                "repos/${REPO}/issues/${PR_NUMBER}/events?per_page=100" \
                --jq '.[] | [.event, (.label.name // ""), (.actor.login // "")] | @tsv'
            )"; then
              return 1
            fi
            safe_event="$(
              awk -F '\t' \
                '$2 == "safe-automerge" && ($1 == "labeled" || $1 == "unlabeled") { latest=$0 } END { print latest }' \
                <<<"$label_events"
            )"
            expected_safe_event=$'labeled\tsafe-automerge\trenovate[bot]'
            breaking_event_pattern=$'labeled\tbreaking-update\t'
            [ "$safe_event" = "$expected_safe_event" ] \
              && ! grep -Fq "$breaking_event_pattern" <<<"$label_events"
          }

          force_revoke=false
          if [ "$PR_ACTION" = "synchronize" ] \
            && [ "$TRIGGER_ACTOR" != "renovate[bot]" ]; then
            force_revoke=true
          fi

          if [ "$force_revoke" != "true" ] && current_live_is_safe; then
            echo "Current live PR state is safe; no revocation is needed."
            exit 0
          fi

          owner="${REPO%%/*}"
          name="${REPO#*/}"
          auto_merge_enabled="$(
            gh api graphql \
              -f query="query(\$owner:String!,\$name:String!,\$number:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$number){autoMergeRequest{__typename}}}}" \
              -f owner="$owner" \
              -f name="$name" \
              -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.autoMergeRequest != null'
          )"
          case "$auto_merge_enabled" in
            true) gh pr merge "$PR_URL" --disable-auto ;;
            false) ;;
            *)
              echo "ERROR: unable to determine auto-merge state for ${PR_URL}." >&2
              exit 1
              ;;
          esac

      - name: Enable auto-merge after live-state verification
        if: steps.guard.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          renovate_owns_head() {
            local author commits committer expected_head last_sha reason sha verified
            expected_head="$1"
            commits="$(
              gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[] | [.sha, (.author.login // ""), (.committer.login // ""), (.commit.verification.verified | tostring), (.commit.verification.reason // "")] | @tsv'
            )" || return 1
            [ -n "$commits" ] || return 1
            last_sha=""
            while IFS=$'\t' read -r sha author committer verified reason; do
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
              [ "$author" = "renovate[bot]" ] || return 1
              [ "$committer" = "web-flow" ] || return 1
              [ "$verified" = "true" ] || return 1
              [ "$reason" = "valid" ] || return 1
              last_sha="$sha"
            done <<<"$commits"
            [ "$last_sha" = "$expected_head" ]
          }

          assert_live_safe() {
            local breaking_event_pattern expected_safe_event label_events live_pr safe_event
            if ! live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"; then
              return 1
            fi
            if ! jq -e \
              --arg author "$PR_AUTHOR" \
              --arg base "$PR_BASE" \
              --arg head "$PR_HEAD" \
              --arg head_sha "$PR_HEAD_SHA" \
              --arg repo "$REPO" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("renovate") != null)
               and ([.labels[].name] | index("dependencies") != null)
               and ([.labels[].name] | index("safe-automerge") != null)
               and ([.labels[].name] | index("breaking-update") == null)' \
              >/dev/null <<<"$live_pr"; then
              return 1
            fi
            if ! renovate_owns_head "$PR_HEAD_SHA"; then
              return 1
            fi
            if ! label_events="$(
              gh api --paginate \
                "repos/${REPO}/issues/${PR_NUMBER}/events?per_page=100" \
                --jq '.[] | [.event, (.label.name // ""), (.actor.login // "")] | @tsv'
            )"; then
              return 1
            fi
            safe_event="$(
              awk -F '\t' \
                '$2 == "safe-automerge" && ($1 == "labeled" || $1 == "unlabeled") { latest=$0 } END { print latest }' \
                <<<"$label_events"
            )"
            expected_safe_event=$'labeled\tsafe-automerge\trenovate[bot]'
            breaking_event_pattern=$'labeled\tbreaking-update\t'
            [ "$safe_event" = "$expected_safe_event" ] \
              && ! grep -Fq "$breaking_event_pattern" <<<"$label_events"
          }

          disable_auto_merge() {
            local auto_merge_enabled name owner
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            auto_merge_enabled="$(
              gh api graphql \
                -f query="query(\$owner:String!,\$name:String!,\$number:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$number){autoMergeRequest{__typename}}}}" \
                -f owner="$owner" \
                -f name="$name" \
                -F number="$PR_NUMBER" \
                --jq '.data.repository.pullRequest.autoMergeRequest != null'
            )"
            [ "$auto_merge_enabled" = false ] \
              || gh pr merge "$PR_URL" --disable-auto
          }

          if ! assert_live_safe; then
            disable_auto_merge
            exit 1
          fi
          # The protected develop branch requires zero approving reviews. Its
          # governance policy deliberately prohibits Actions from submitting
          # reviews, so a synthetic self-approval would only make this path
          # fail. Auto-merge still waits for every required current-head check.
          gh pr merge "$PR_URL" --auto --merge --delete-branch \
            --match-head-commit "$PR_HEAD_SHA"

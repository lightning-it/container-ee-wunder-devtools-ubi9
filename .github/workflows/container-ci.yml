# yamllint disable rule:truthy rule:line-length
---
name: Container CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate container repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run container CI parity checks
        env:
          WUNDER_DEVTOOLS_DOCKER_SOCKET: required
          WUNDER_DEVTOOLS_NETWORK: bridge
          WUNDER_DEVTOOLS_PRUNE_BUILDKIT_CACHE: "true"
          WUNDER_DEVTOOLS_WORKSPACE_MODE: rw
        run: bash scripts/wunder-devtools-ee.sh scripts/devtools-container-ci.sh all

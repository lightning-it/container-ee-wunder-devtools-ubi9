# yamllint disable rule:truthy rule:line-length
---
name: Sync main back to develop

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Open main-to-develop sync PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true

      - name: Configure git author
        run: |
          git config user.name "lightning-it-release-automation[bot]"
          git config user.email "307565056+lightning-it-release-automation[bot]@users.noreply.github.com"

      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve release automation App bot identity
        id: release-bot
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot_json="$(gh api "users/${APP_SLUG}%5Bbot%5D" 2>/dev/null || printf '{}')"
          login="$(jq -r '.login // ""' <<<"$bot_json")"
          bot_id="$(jq -r '.id // ""' <<<"$bot_json")"
          if [ "$login" != "${APP_SLUG}[bot]" ] || ! [[ "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the release automation App bot identity."
            exit 1
          fi
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - name: Create or update sync PR
        env:
          BOT_TOKEN: ${{ steps.release-app.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_token="${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
          if [ -n "${BOT_TOKEN:-}" ]; then
            if GH_TOKEN="$BOT_TOKEN" gh api 'users/lightning-it-release-automation%5Bbot%5D' --jq '.login' >/dev/null 2>&1; then
              pr_token="$BOT_TOKEN"
            else
              echo "release automation App token is not valid; falling back to GITHUB_TOKEN."
            fi
          fi

          if ! GH_TOKEN="$pr_token" gh auth status --hostname github.com >/dev/null 2>&1; then
            echo "No valid GitHub token is available for main-to-develop sync PRs."
            exit 1
          fi

          git fetch origin main develop
          sync_branch="chore/sync-main-to-develop"
          title="chore: sync main back to develop"

          pr_url="$(GH_TOKEN="$pr_token" gh pr list \
            --repo "$REPO" \
            --base develop \
            --head "$sync_branch" \
            --state open \
            --json url \
            --jq '.[0].url')"

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main; nothing to sync."
            if [ -n "$pr_url" ]; then
              GH_TOKEN="$pr_token" gh pr close "$pr_url" \
                --repo "$REPO" \
                --comment "Closing empty back-sync PR: develop already contains main."
            fi
            exit 0
          fi

          git checkout -B "$sync_branch" origin/develop
          git merge --no-ff origin/main -m "chore: sync main back to develop"
          git push --force-with-lease origin "HEAD:${sync_branch}"

          body=$'Back-sync PR from `main` to `develop`.\n\n'
          body+=$'This keeps `develop` ancestry current after a production '
          body+=$'promotion merge into `main`, so the next `develop` to `main` '
          body+=$'promotion PR can open cleanly.'

          if [ -z "$pr_url" ]; then
            GH_TOKEN="$pr_token" gh pr create \
              --repo "$REPO" \
              --base develop \
              --head "$sync_branch" \
              --title "$title" \
              --body "$body"
          else
            GH_TOKEN="$pr_token" gh pr edit "$pr_url" \
              --repo "$REPO" \
              --title "$title" \
              --body "$body"
          fi

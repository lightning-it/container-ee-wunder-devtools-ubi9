# yamllint disable rule:truthy rule:line-length
---
name: Container Build

on:
  pull_request:
    branches: ["develop"]
    paths:
      - "Dockerfile"
      - "Containerfile"
      - ".dockerignore"
      - "bindep.txt"
      - "requirements*.txt"
      - "rpm-packages.txt"
      - "copr-packages.txt"
      - "collections/**"
      - "roles/**"
      - "scripts/**"
      - ".github/workflows/container-build.yml"
  push:
    branches: ["develop"]
    paths:
      - "Dockerfile"
      - "Containerfile"
      - ".dockerignore"
      - "bindep.txt"
      - "requirements*.txt"
      - "rpm-packages.txt"
      - "copr-packages.txt"
      - "collections/**"
      - "roles/**"
      - "scripts/**"
      - ".github/workflows/container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          driver-opts: image=docker.io/moby/buildkit:buildx-stable-1@sha256:63db51c9b30208a7c2b1c40392c7ebb9ce2f85ba238a18a85420f8f5ea2d4684

      - name: Compute build metadata
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "IMAGE_NAME=local/${repo}"
            echo "IMAGE_TAG=build-${short_sha}"
            echo "FULL_SHA=$(git rev-parse HEAD)"
            echo "CREATED=${created}"
          } >> "$GITHUB_ENV"

      - name: Build image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            COLLECTION_PROFILE=public
            TARGETARCH=amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.FULL_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.title=${{ github.event.repository.name }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          repo="${GITHUB_REPOSITORY#*/}"

          case "$repo" in
            container-ee-wunder-devtools-ubi9)
              docker run --rm "$image" bash -lc '
                set -euo pipefail
                ansible --version
                ansible-galaxy --version
                yamllint --version
                actionlint --version
                python --version
              '
              ;;
            container-ee-wunder-ansible-ubi9)
              docker run --rm "$image" bash -lc '
                set -euo pipefail
                ansible --version
                ansible-galaxy --version
                ansible-runner --version
              '
              ;;
            container-ee-wunder-toolbox-ubi9)
              docker run --rm "$image" bash -lc '
                set -euo pipefail
                ansible-navigator --version
                ansible-doc --version
                helm version --short
                kustomize version
                vault --version
              '
              ;;
            *)
              docker run --rm "$image" bash -lc 'command -v bash && true'
              ;;
          esac

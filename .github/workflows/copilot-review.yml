# Managed by lightning-it/shared-assets-lit.
# Do not edit downstream copies directly.
# Protected per-repository MLX-90/REP-60 current-revision controller.
# Release-App review belongs only to the sibling protected controller at
# .github/workflows/release-bot-exact-head-review.yml.
# yamllint disable rule:truthy rule:line-length
---
name: Current revision review gate

on:
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        edited,
        labeled,
        unlabeled,
      ]

permissions:
  contents: read
  pull-requests: read

env:
  COPILOT_REVIEWER_LOGIN: copilot-pull-request-reviewer
  NO_FILES_REVIEW_MARKER: was not able to review any files
  UNABLE_REVIEW_MARKER: unable to review this pull request
  QUOTA_EXHAUSTED_MARKER: quota exhausted
  QUOTA_EXCEEDED_MARKER: quota exceeded
  SUPPRESSED_COMMENTS_MARKER: suppressed comments

concurrency:
  # A synchronize/reopened verifier run must never cancel the one-time
  # opened/ready_for_review request run before that request is recorded. GitHub
  # can otherwise leave an already successful required check in "expected".
  group: copilot-review-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

# Release-App pull requests use only the sibling protected MLX-90 §7.2
# Exact-Revision Codex check, without an exemption in this controller. This
# workflow retains the final-head GitHub Copilot path for applicable human PRs
# plus the separately identified Shared-Assets-App automation exemptions.
jobs:
  request-current-revision-review:
    name: Request Copilot review for current revision
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'opened' ||
        github.event.action == 'ready_for_review') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'litroc' &&
      github.actor == 'litroc' &&
      github.triggering_actor == 'litroc'
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Request Copilot review for the current revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${DEFAULT_BRANCH}" = develop
          [[ "${EXPECTED_BASE_REF}" =~ ^(develop|main)$ ]]
          test "${TRUSTED_WORKFLOW_REF}" = \
            "${REPOSITORY}/.github/workflows/copilot-review.yml@refs/heads/${EXPECTED_BASE_REF}"
          test "${TRUSTED_WORKFLOW_SHA}" = "${EXPECTED_BASE}"
          protected_run="$(gh api "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e \
            --arg branch "${EXPECTED_HEAD_REF}" \
            --arg repository "${REPOSITORY}" \
            --arg sha "${EXPECTED_HEAD}" '
              .event == "pull_request_target"
              and .name == "Current revision review gate"
              and .path == ".github/workflows/copilot-review.yml"
              and .head_branch == $branch
              and .head_sha == $sha
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
            ' <<<"${protected_run}" >/dev/null
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"${pr}")" = open
          test "$(jq -r .draft <<<"${pr}")" = false
          base_ref="$(jq -er '.base.ref | select(. == "develop" or . == "main")' <<<"${pr}")"
          test "${base_ref}" = "${EXPECTED_BASE_REF}"
          test "$(jq -r .base.sha <<<"${pr}")" = "${EXPECTED_BASE}"
          test "$(jq -r .base.repo.full_name <<<"${pr}")" = "${REPOSITORY}"
          test "$(jq -r .head.sha <<<"${pr}")" = "${EXPECTED_HEAD}"
          test "$(jq -r .head.repo.full_name <<<"${pr}")" = "${REPOSITORY}"
          # Re-prove the contributor-funding boundary from live PR state even
          # though the protected job predicate already restricts this path.
          test "$(jq -r .user.login <<<"${pr}")" = litroc
          reviewer_login="${COPILOT_REVIEWER_LOGIN%\[bot\]}"
          reviewer="${reviewer_login}[bot]"
          requested_reviewers_url="repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers"
          marker="<!-- mlx90-copilot-request head=${EXPECTED_HEAD} -->"
          review_exists_for_head() {
            local reviews
            reviews="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            jq -e \
              --arg reviewer "${reviewer}" \
              --arg head "${EXPECTED_HEAD}" \
              --arg retry_unable "${UNABLE_REVIEW_MARKER}" \
              --arg retry_no_files "${NO_FILES_REVIEW_MARKER}" \
              --arg retry_quota_exhausted "${QUOTA_EXHAUSTED_MARKER}" \
              --arg retry_quota_exceeded "${QUOTA_EXCEEDED_MARKER}" \
              --arg retry_suppressed "${SUPPRESSED_COMMENTS_MARKER}" '
                any(add[];
                  .user.login == $reviewer
                  and .commit_id == $head
                  and (.state == "COMMENTED" or .state == "APPROVED")
                  and (((.body // "") | ascii_downcase) as $body
                    | ($body | contains($retry_unable) | not)
                    and ($body | contains($retry_no_files) | not)
                    and ($body | contains("able to review any files") | not)
                    and ($body | contains($retry_quota_exhausted) | not)
                    and ($body | contains($retry_quota_exceeded) | not)
                    and ($body | contains($retry_suppressed) | not)
                    and ($body | contains("encountered an error") | not))
                )
              ' <<<"${reviews}" >/dev/null
          }
          if review_exists_for_head; then
            echo "Copilot already reviewed the exact finalized head."
            exit 0
          fi
          reviewer_is_requested() {
            local response
            if ! response="$(gh api "${requested_reviewers_url}")"; then
              return 2
            fi
            jq -e --arg reviewer "${reviewer}" \
              'any(.users[]?; .login == $reviewer)' <<<"${response}" >/dev/null
          }
          comments="$(gh api --paginate --slurp "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          marker_exists=false
          if jq -e --arg marker "${marker}" \
            'any(add[]; .user.login == "github-actions[bot]" and (.body | contains($marker)))' \
            <<<"${comments}" >/dev/null; then
            marker_exists=true
          fi
          if reviewer_is_requested; then
            if [ "${marker_exists}" = false ]; then
              gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                -f body="<!-- mlx90-copilot-request head=${EXPECTED_HEAD} -->Copilot review request accepted for finalized head ${EXPECTED_HEAD}." >/dev/null
            fi
            echo "Copilot review is already pending for the exact finalized head."
            exit 0
          else
            request_status=$?
            if [ "${request_status}" -ne 1 ]; then
              exit "${request_status}"
            fi
          fi
          if [ "${marker_exists}" = true ]; then
            echo "The one exact-head Copilot request was already consumed; automatic retry is forbidden." >&2
            exit 1
          fi
          if ! gh api --method POST "${requested_reviewers_url}" \
              -f "reviewers[]=${reviewer}"; then
            # A concurrent protected request may win after the pre-check.
            # Accept only the verified idempotent outcome; every API failure
            # without the expected live reviewer remains fail-closed.
            if reviewer_is_requested; then
              echo "A concurrent workflow already requested Copilot review."
            else
              verification_status=$?
              exit "${verification_status}"
            fi
          fi
          if [ "${marker_exists}" = false ]; then
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="<!-- mlx90-copilot-request head=${EXPECTED_HEAD} -->Copilot review request accepted for finalized head ${EXPECTED_HEAD}." >/dev/null
          fi

  verify-current-revision-policy:
    name: Verify current revision policy
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'lightning-it-release-automation[bot]' &&
      (github.event.action == 'edited' ||
        github.event.action == 'labeled' ||
        github.event.action == 'unlabeled' ||
        github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review')
    # Serialize every producer for this PR. Different event actions may overlap
    # at workflow level so the one-time Copilot request is never cancelled, but
    # no two verifier jobs may invalidate or publish the neutral check at once.
    concurrency:
      group: copilot-review-verify-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Invalidate prior result after pull-request metadata change
        if: >-
          github.event.action == 'edited' ||
          github.event.action == 'labeled' ||
          github.event.action == 'unlabeled'
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          EVENT_EDITED_AT: ${{ github.event.pull_request.updated_at }}
          EVENT_LABEL: ${{ github.event.label.name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api_read() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "GitHub API read failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          api_patch() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api --method PATCH "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Idempotent GitHub check invalidation failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${HEAD_REPOSITORY}" == */* ]]
          [[ "${EVENT_ACTION}" =~ ^(edited|labeled|unlabeled)$ ]]
          if [ "${EVENT_ACTION}" = edited ]; then
            # For an edited webhook, REST updated_at is the event's edit
            # revision. Bind it to GraphQL lastEditedAt because unrelated
            # comments and reviews may advance only the live REST updated_at.
            [[ "${EVENT_EDITED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            owner="${REPOSITORY%%/*}"
            repository="${REPOSITORY#*/}"
            read -r -d '' query <<'GRAPHQL' || true
          query($owner: String!, $repository: String!, $number: Int!) {
            repository(owner: $owner, name: $repository) {
              pullRequest(number: $number) {
                number
                lastEditedAt
              }
            }
          }
          GRAPHQL
            metadata="$(api_read graphql \
              -f query="${query}" \
              -F owner="${owner}" \
              -F repository="${repository}" \
              -F number="${PR_NUMBER}")"
            jq -e \
              --arg edited_at "${EVENT_EDITED_AT}" \
              --argjson number "${PR_NUMBER}" '
                ((.errors // []) | length) == 0
                and .data.repository.pullRequest.number == $number
                and .data.repository.pullRequest.lastEditedAt == $edited_at
              ' <<<"${metadata}" >/dev/null
            pr="$(api_read "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          else
            test -n "${EVENT_LABEL}"
            transition_observed=false
            for transition_attempt in $(seq 1 10); do
              pr="$(api_read "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
              if jq -e --arg action "${EVENT_ACTION}" --arg label "${EVENT_LABEL}" '
                  (.labels | type) == "array"
                  and all(.labels[];
                    type == "object" and (.name | type) == "string")
                  and (if $action == "labeled" then
                    any(.labels[]; .name == $label)
                  else all(.labels[]; .name != $label) end)
                ' <<<"${pr}" >/dev/null; then
                transition_observed=true
                break
              fi
              test "${transition_attempt}" -lt 10
              sleep 2
            done
            test "${transition_observed}" = true
          fi
          jq -e \
            --arg action "${EVENT_ACTION}" \
            --arg base_ref "${EVENT_BASE_REF}" \
            --arg base_sha "${BASE_SHA}" \
            --arg body "${EVENT_BODY}" \
            --arg head_ref "${HEAD_REF}" \
            --arg head_repository "${HEAD_REPOSITORY}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg label "${EVENT_LABEL}" \
            --arg title "${EVENT_TITLE}" '
              .state == "open"
              and .draft == false
              and (if $action == "edited" then
                .title == $title and (.body // "") == $body
              else true end)
              and .base.ref == $base_ref
              and .base.sha == $base_sha
              and .head.ref == $head_ref
              and .head.sha == $head_sha
              and .head.repo.full_name == $head_repository
              and (.labels | type) == "array"
              and all(.labels[];
                type == "object" and (.name | type) == "string")
              and (if $action == "labeled" then
                any(.labels[]; .name == $label)
              elif $action == "unlabeled" then
                all(.labels[]; .name != $label)
              else true end)
            ' <<<"${pr}" >/dev/null
          checks="$(api_read --paginate --slurp \
            "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"
          named="$(jq -c '[.[].check_runs[]? |
            select(.name == "Current revision review") |
            select(.app.id == 15368 and .app.slug == "github-actions") |
            select((.external_id // "") |
              startswith("mlx90-current-revision:"))]' \
            <<<"${checks}")"
          count="$(jq 'length' <<<"${named}")"
          if [ "${count}" -gt 1 ]; then
            echo "Multiple protected Current revision review results exist for ${HEAD_SHA}." >&2
            exit 1
          fi
          if [ "${count}" -eq 0 ]; then
            exit 0
          fi
          check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${named}")"
          run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${EVENT_ACTION}" = edited ]; then
            reason='pull-request title or body changed'
            result_title='Current revision metadata changed; revalidation required'
            reservation_kind=edit
          else
            reason="pull-request labels changed (${EVENT_ACTION}: ${EVENT_LABEL})"
            result_title='Current revision labels changed; revalidation required'
            reservation_kind="${EVENT_ACTION}"
          fi
          evidence="$(jq -cn \
            --arg base "${BASE_SHA}" \
            --arg head "${HEAD_SHA}" \
            --arg reason "${reason}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson run_id "${GITHUB_RUN_ID}" \
            --arg run_url "${run_url}" \
            '{schema:4,base_sha:$base,head_sha:$head,pull_request_number:$pr_number,
              producer_run_id:$run_id,reason:$reason,run_url:$run_url}')"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          updated="$(api_patch \
            "repos/${REPOSITORY}/check-runs/${check_id}" \
            -f status=completed \
            -f conclusion=failure \
            -f "completed_at=${completed_at}" \
            -f "details_url=${run_url}" \
            -f "external_id=mlx90-current-revision:metadata-${reservation_kind}:v1:${PR_NUMBER}:${GITHUB_RUN_ID}:${BASE_SHA}:${HEAD_SHA}" \
            -f "output[title]=${result_title}" \
            -f "output[summary]=${evidence}")"
          jq -e \
            --arg evidence "${evidence}" \
            --arg head "${HEAD_SHA}" \
            --argjson check_id "${check_id}" '
              .id == $check_id
              and .name == "Current revision review"
              and .app.id == 15368
              and .app.slug == "github-actions"
              and .head_sha == $head
              and .status == "completed"
              and .conclusion == "failure"
              and .output.summary == $evidence
            ' <<<"${updated}" >/dev/null

      - name: Capture live pull-request metadata revision
        id: metadata-revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"
          repository="${REPOSITORY#*/}"
          read -r -d '' query <<'GRAPHQL' || true
          query($owner: String!, $repository: String!, $number: Int!) {
            repository(owner: $owner, name: $repository) {
              pullRequest(number: $number) {
                number
                lastEditedAt
              }
            }
          }
          GRAPHQL
          response=''
          for attempt in $(seq 1 5); do
            if response="$(gh api graphql \
                -f query="${query}" \
                -F owner="${owner}" \
                -F repository="${repository}" \
                -F number="${PR_NUMBER}")" \
              && jq -e \
                --argjson number "${PR_NUMBER}" '
                  ((.errors // []) | length) == 0
                  and .data.repository.pullRequest.number == $number
                  and (
                    .data.repository.pullRequest.lastEditedAt == null
                    or (
                      (.data.repository.pullRequest.lastEditedAt | type) == "string"
                      and (.data.repository.pullRequest.lastEditedAt |
                        test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
                    )
                  )
                ' <<<"${response}" >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Unable to capture the protected pull-request metadata revision." >&2
              exit 1
            fi
            sleep 5
          done
          last_edited_at="$(jq -r \
            '.data.repository.pullRequest.lastEditedAt // "null"' \
            <<<"${response}")"
          live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          labels_json="$(jq -cer '
            if (.labels | type) == "array"
              and all(.labels[]; type == "object" and (.name | type) == "string")
            then [.labels[].name] | sort
            else error("malformed pull-request labels")
            end
          ' <<<"${live_pr}")"
          labels_sha256="$(printf '%s' "${labels_json}" | sha256sum | cut -d ' ' -f 1)"
          [[ "${labels_sha256}" =~ ^[0-9a-f]{64}$ ]]
          echo "last_edited_at=${last_edited_at}" >>"${GITHUB_OUTPUT}"
          echo "labels_sha256=${labels_sha256}" >>"${GITHUB_OUTPUT}"

      - name: Classify trusted automation pull request
        id: trusted-automation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          trusted=false
          trusted_kind=none
          live_pr="{}"
          policy_label_events="[]"
          if [ "${PR_AUTHOR}" = "renovate[bot]" ] \
            && [ "${PR_HEAD_REPO}" = "${REPOSITORY}" ] \
            && [[ "${PR_HEAD}" == renovate/* ]] \
            && [ "${PR_BASE}" = "develop" ]; then
            if live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" \
              && jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" \
              --arg head_sha "${PR_HEAD_SHA}" \
              --arg repo "${REPOSITORY}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("renovate") != null)
               and ([.labels[].name] | index("dependencies") != null)
               and ([.labels[].name] | index("safe-automerge") != null)
               and ([.labels[].name] | index("breaking-update") == null)' \
                <<<"${live_pr}" >/dev/null \
              && policy_label_events="$(
                gh api --paginate --slurp \
                  "repos/${REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100"
              )" \
              && jq -e \
                --arg safe_label "safe-automerge" \
                --arg breaking_label "breaking-update" \
                --arg author "${PR_AUTHOR}" '
                [ .[][]?
                  | select(
                      (.event == "labeled" or .event == "unlabeled")
                      and (
                        .label.name == $safe_label
                        or .label.name == $breaking_label
                      )
                    )
                  | {
                      event: .event,
                      actor: (.actor.login // ""),
                      created_at: (.created_at // ""),
                      event_id: (.id // 0),
                      label: .label.name
                    }
                ]
                | sort_by(.created_at, .event_id) as $events
                | ([ range(0; ($events | length))
                    | select(
                        $events[.].label == $safe_label
                        and $events[.].event == "labeled"
                      )
                  ] | last) as $last_safe_index
                | $last_safe_index != null
                and $events[$last_safe_index].actor == $author
                and ([
                    $events[]
                    | select(
                        .label == $breaking_label
                        and .event == "labeled"
                      )
                  ] | length == 0)
                and ([
                    $events[]
                    | select(
                        .label == $safe_label
                          and .actor != $author
                      )
                  ] | length == 0)' \
                <<<"${policy_label_events}" >/dev/null; then
              trusted=true
              trusted_kind=renovate
            fi
          elif [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ] \
            && [ "${PR_HEAD_REPO}" = "${REPOSITORY}" ] \
            && [[ "${PR_HEAD}" == chore/sync-shared-assets-lit-* ]] \
            && [ "${PR_BASE}" = "develop" ] \
            && { [ "${PR_TITLE}" = "chore: sync shared-assets-lit" ] \
              || [ "${PR_TITLE}" = "chore: sync shared assets" ]; } \
            && live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" \
            && jq -e \
              --arg author "${PR_AUTHOR}" --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" --arg head_sha "${PR_HEAD_SHA}" --arg title "${PR_TITLE}" \
              --arg repo "${REPOSITORY}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha) and (.title == $title)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("chore") != null)
               and ([.labels[].name] | index("shared-assets-lit") != null)' \
              <<<"${live_pr}" >/dev/null; then
            trusted=true
            trusted_kind=shared-assets
          elif [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ] \
            && [ "${PR_HEAD_REPO}" = "${REPOSITORY}" ] \
            && [[ "${PR_HEAD}" == chore/sync-repository-quality-* ]] \
            && [ "${PR_BASE}" = "develop" ] \
            && [ "${PR_TITLE}" = "chore: sync repository quality assets" ] \
            && live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" \
            && jq -e \
              --arg author "${PR_AUTHOR}" --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" --arg head_sha "${PR_HEAD_SHA}" --arg title "${PR_TITLE}" \
              --arg repo "${REPOSITORY}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha) and (.title == $title)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("chore") != null)
               and ([.labels[].name] | index("shared-assets-lit") != null)' \
              <<<"${live_pr}" >/dev/null; then
            trusted=true
            trusted_kind=repository-quality
          elif [ "${REPOSITORY}" = "lightning-it/.github" ] \
            && [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ] \
            && [ "${PR_HEAD_REPO}" = "${REPOSITORY}" ] \
            && [[ "${PR_HEAD}" == backmerge/*-main ]] \
            && [ "${PR_BASE}" = "develop" ] \
            && [[ "${PR_TITLE}" == "chore(governance): record main ancestry before "* ]] \
            && live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" \
            && jq -e \
              --arg author "${PR_AUTHOR}" --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" --arg head_sha "${PR_HEAD_SHA}" --arg title "${PR_TITLE}" \
              --arg repo "${REPOSITORY}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha) and (.title == $title)
               and (.head.repo.full_name == $repo)' \
              <<<"${live_pr}" >/dev/null; then
            trusted=true
            trusted_kind=ancestry-backmerge
          fi
          {
            echo "trusted=${trusted}"
            echo "kind=${trusted_kind}"
          } >>"${GITHUB_OUTPUT}"

      - name: Accept trusted automation exemption
        if: steps.trusted-automation.outputs.trusted == 'true'
        run: |
          if [ "${{ steps.trusted-automation.outputs.kind }}" = renovate ]; then
            {
              echo "### Trusted Renovate exemption"
              echo
              echo "Copilot review is not required for this exact-head trusted Renovate PR."
              echo "Trusted identity and policy verification succeeded."
            } >>"${GITHUB_STEP_SUMMARY}"
          elif [[ "${{ steps.trusted-automation.outputs.kind }}" =~ ^(shared-assets|repository-quality)$ ]]; then
            {
              echo "### Provenance-verified managed distribution"
              echo
              echo "The canonical source change was reviewed before distribution."
              echo "Exact App identity, source SHA/run provenance, and target gates are enforced by the required guarded-automerge policy."
            } >>"${GITHUB_STEP_SUMMARY}"
          elif [ "${{ steps.trusted-automation.outputs.kind }}" = ancestry-backmerge ]; then
            echo "The deterministic ancestry exemption is verified against both live branch tips and the single bound ancestry-evidence file."
          else
            echo "Trusted automation PR; Copilot review is delegated to its required guarded-automerge policy."
          fi

      - name: Verify evidence-bound ancestry backmerge
        if: steps.trusted-automation.outputs.kind == 'ancestry-backmerge'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_commit="$(gh api "repos/${REPOSITORY}/git/commits/${HEAD_SHA}")"
          current_develop="$(gh api "repos/${REPOSITORY}/branches/develop" --jq .commit.sha)"
          current_main="$(gh api "repos/${REPOSITORY}/branches/main" --jq .commit.sha)"
          jq -e \
            --arg develop "${current_develop}" \
            --arg main "${current_main}" \
            '(.parents | length) == 2
             and .parents[0].sha == $develop
             and .parents[1].sha == $main' \
            <<<"${head_commit}" >/dev/null
          test "${BASE_SHA}" = "${current_develop}"
          commit_response="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}")"
          jq -e \
            --arg base "${BASE_SHA}" \
            --arg head "${HEAD_SHA}" \
            --arg main "${current_main}" '
              .sha == $head
              and (.parents | length) == 2
              and .parents[0].sha == $base
              and .parents[1].sha == $main
              and (.files | length) == 1
              and .files[0].filename == ".lit/main-ancestry.json"
              and (.files[0].status == "added" or .files[0].status == "modified")
              and (.files[0].previous_filename == null)
            ' <<<"${commit_response}" >/dev/null
          evidence_response="$(gh api \
            "repos/${REPOSITORY}/contents/.lit/main-ancestry.json?ref=${HEAD_SHA}")"
          jq -e '.type == "file" and .encoding == "base64" and (.size > 0)' \
            <<<"${evidence_response}" >/dev/null
          evidence_json="$(jq -r .content <<<"${evidence_response}" | tr -d '\n' | base64 --decode)"
          jq -e \
            --arg repository "${REPOSITORY}" \
            --arg main "${current_main}" \
            --arg develop "${current_develop}" '
              (keys | sort) == ["develop_parent_sha", "main_sha", "purpose", "repository", "schema_version"]
              and .schema_version == 1
              and .repository == $repository
              and .main_sha == $main
              and .develop_parent_sha == $develop
              and .purpose == "Bind the reviewed main ancestry backmerge."
            ' <<<"${evidence_json}" >/dev/null
          echo "Verified an exact evidence-bound merge of current develop and main tips."

      - name: Verify current Copilot review and resolved findings
        id: copilot-review
        if: >-
          steps.trusted-automation.outputs.trusted != 'true' &&
          github.event.pull_request.user.login != 'lightning-it-release-automation[bot]'
        env:
          BOUND_LAST_EDITED_AT: ${{ steps.metadata-revision.outputs.last_edited_at }}
          FRESH_REVIEW_AFTER: ${{ github.event.pull_request.updated_at }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REQUIRE_FRESH_REVIEW: ${{ github.event.action == 'edited' }}
        run: |
          set -euo pipefail

          owner="${REPOSITORY%%/*}"
          repository="${REPOSITORY#*/}"

          graphql() {
            local api_attempt output
            for api_attempt in $(seq 1 5); do
              if output="$(gh api graphql "$@")"; then
                if jq -e '((.errors // []) | length) == 0' <<<"${output}" >/dev/null; then
                  printf '%s' "${output}"
                  return 0
                fi
                jq -r '.errors[]?.message' <<<"${output}" >&2
              fi
              echo "GitHub GraphQL request failed (attempt ${api_attempt}/5)." >&2
              sleep 5
            done
            return 1
          }

          read -r -d '' review_query <<'GRAPHQL' || true
          query(
            $owner: String!
            $repository: String!
            $number: Int!
            $before: String
          ) {
            repository(owner: $owner, name: $repository) {
              pullRequest(number: $number) {
                headRefOid
                lastEditedAt
                reviews(last: 100, before: $before) {
                  pageInfo { hasPreviousPage startCursor }
                  nodes {
                    id
                    author { login }
                    commit { oid }
                    state
                    submittedAt
                  }
                }
              }
            }
          }
          GRAPHQL

          read -r -d '' review_comments_query <<'GRAPHQL' || true
          query(
            $review: ID!
            $after: String
          ) {
            node(id: $review) {
              ... on PullRequestReview {
                body
                commit { oid }
                pullRequest { headRefOid }
                comments(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  nodes { body }
                }
              }
            }
          }
          GRAPHQL

          review_comments_clean() {
            local review_id="$1" expected_head="$2" after="" response has_next
            local content_counts marker_count content_count meaningful_content=false
            local count_pattern=$'^[0-9]+\t[0-9]+$'
            local -a arguments
            while true; do
              arguments=(
                -f query="${review_comments_query}"
                -f review="${review_id}"
              )
              if [ -n "${after}" ]; then
                arguments+=(-f after="${after}")
              fi

              if ! response="$(graphql "${arguments[@]}")"; then
                return 2
              fi
              if ! jq -e \
                --arg head "${expected_head}" \
                '(.data.node.comments != null)
                  and (.data.node.commit.oid == $head)
                  and (.data.node.pullRequest.headRefOid == $head)' \
                <<<"${response}" >/dev/null; then
                echo "Review ${review_id} no longer matches current head ${expected_head}." >&2
                return 2
              fi

              if ! content_counts="$(
                jq -er \
                  --arg unable_marker "${UNABLE_REVIEW_MARKER}" \
                  --arg no_files_marker "${NO_FILES_REVIEW_MARKER}" \
                  --arg quota_exhausted_marker "${QUOTA_EXHAUSTED_MARKER}" \
                  --arg quota_exceeded_marker "${QUOTA_EXCEEDED_MARKER}" \
                  --arg suppressed_comments_marker "${SUPPRESSED_COMMENTS_MARKER}" \
                  'def normalize_review_text:
                      ascii_downcase
                      | gsub("wasn[\u0027\u2019]t"; "was not")
                      | gsub("\\s"; "");
                  def review_content:
                      (.data.node.body // ""),
                      (.data.node.comments.nodes[]?.body // "");
                  ($unable_marker | normalize_review_text) as $unable
                  | ($no_files_marker | normalize_review_text) as $no_files
                  | ($quota_exhausted_marker | normalize_review_text) as $quota_exhausted
                  | ($quota_exceeded_marker | normalize_review_text) as $quota_exceeded
                  | ($suppressed_comments_marker | normalize_review_text) as $suppressed
                  | [
                    ([
                      review_content
                      | select(
                          normalize_review_text
                          | (
                              contains($unable)
                              or contains($no_files)
                              or contains($quota_exhausted)
                              or contains($quota_exceeded)
                              or contains($suppressed)
                            )
                        )
                    ] | length),
                    ([
                      review_content
                      | select((gsub("\\s"; "")) != "")
                    ] | length)
                  ]
                  | @tsv' <<<"${response}"
              )"; then
                echo "Unable to parse review content counts for review ${review_id}; refusing to accept the review." >&2
                return 2
              fi
              if [[ ! "${content_counts}" =~ ${count_pattern} ]]; then
                echo "Review ${review_id} returned invalid review content counts; refusing to accept the review." >&2
                return 2
              fi
              IFS=$'\t' read -r marker_count content_count <<<"${content_counts}"
              if [ "${marker_count}" -gt 0 ]; then
                return 1
              fi
              if [ "${content_count}" -gt 0 ]; then
                meaningful_content=true
              fi

              has_next="$(jq -r '.data.node.comments.pageInfo.hasNextPage' <<<"${response}")"
              if [ "${has_next}" != "true" ]; then
                if [ "${meaningful_content}" = true ]; then
                  return 0
                fi
                return 1
              fi
              after="$(jq -r '.data.node.comments.pageInfo.endCursor // empty' <<<"${response}")"
              if [ -z "${after}" ]; then
                echo "Review-comment pagination cursor is missing." >&2
                return 2
              fi
            done
          }

          # A rejected review cannot become acceptable during this run without
          # an edit event, which starts a fresh run through the concurrency
          # group. Cache rejected IDs so marker-only, empty, or whitespace-only
          # reviews cost one detail query per run instead of one query on every
          # polling attempt.
          declare -A rejected_review_ids=()
          review_complete=false
          head_sha=""
          for attempt in $(seq 1 40); do
            head_sha=""
            before=""
            request_failed=false
            while true; do
              arguments=(
                -f query="${review_query}"
                -F owner="${owner}"
                -F repository="${repository}"
                -F number="${PR_NUMBER}"
              )
              if [ -n "${before}" ]; then
                arguments+=(-f before="${before}")
              fi

              if ! response="$(graphql "${arguments[@]}")"; then
                request_failed=true
                break
              fi

              page_head_sha="$(jq -r '.data.repository.pullRequest.headRefOid // empty' <<<"${response}")"
              if [ -z "${page_head_sha}" ]; then
                echo "Unable to determine the pull request head SHA." >&2
                exit 1
              fi
              if [ -n "${head_sha}" ] && [ "${head_sha}" != "${page_head_sha}" ]; then
                echo "Pull request head changed during review verification; retrying." >&2
                request_failed=true
                break
              fi
              head_sha="${page_head_sha}"
              page_last_edited_at="$(jq -r \
                '.data.repository.pullRequest.lastEditedAt // "null"' \
                <<<"${response}")"
              if [ "${page_last_edited_at}" != "${BOUND_LAST_EDITED_AT}" ]; then
                echo "Pull-request metadata changed after this review run was bound." >&2
                exit 1
              fi

              candidate_review_ids="$(
                jq -r \
                  --arg head "${head_sha}" \
                  --arg last_edited_at "${BOUND_LAST_EDITED_AT}" \
                  --arg not_before "${FRESH_REVIEW_AFTER}" \
                  --arg reviewer "${COPILOT_REVIEWER_LOGIN}" \
                  --arg require_fresh "${REQUIRE_FRESH_REVIEW}" \
                  '(.data.repository.pullRequest.reviews.nodes // [])[]
                    | select(
                        (.author.login // "") as $login
                        | ($login == $reviewer or $login == ($reviewer + "[bot]"))
                      )
                    | select(.state == "COMMENTED" or .state == "APPROVED")
                    | select(.commit.oid == $head)
                    | select(
                        $last_edited_at == "null"
                        or ((.submittedAt // "") > $last_edited_at)
                      )
                    | select(
                        $require_fresh != "true"
                        or ((.submittedAt // "") > $not_before)
                      )
                    | (.id // empty)' <<<"${response}"
              )"
              while IFS= read -r review_id; do
                if [ -z "${review_id}" ]; then
                  continue
                fi
                if [ -n "${rejected_review_ids["${review_id}"]:-}" ]; then
                  continue
                fi
                if review_comments_clean "${review_id}" "${head_sha}"; then
                  review_complete=true
                  break
                else
                  comments_status=$?
                  if [ "${comments_status}" -eq 2 ]; then
                    request_failed=true
                    break
                  fi
                  rejected_review_ids["${review_id}"]=1
                fi
              done <<<"${candidate_review_ids}"
              if [ "${review_complete}" = true ]; then
                break 2
              fi
              if [ "${request_failed}" = true ]; then
                break
              fi

              has_previous="$(jq -r '.data.repository.pullRequest.reviews.pageInfo.hasPreviousPage' <<<"${response}")"
              if [ "${has_previous}" != "true" ]; then
                break
              fi
              before="$(jq -r '.data.repository.pullRequest.reviews.pageInfo.startCursor // empty' <<<"${response}")"
              if [ -z "${before}" ]; then
                echo "Review pagination cursor is missing." >&2
                exit 1
              fi
            done

            if [ "${attempt}" -eq 40 ]; then
              if [ "${request_failed}" = true ]; then
                echo "Unable to verify the Copilot review after repeated API or head-change failures." >&2
              else
                echo "GitHub Copilot has not completed a review of current head ${head_sha:-unknown}." >&2
              fi
              exit 1
            fi
            if [ "${request_failed}" = true ]; then
              echo "Retrying review verification after a transient API or head-change failure."
            else
              echo "Waiting for GitHub Copilot to review current head ${head_sha} (attempt ${attempt}/40)."
            fi
            sleep 15
          done

          if [ "${review_complete}" != true ]; then
            echo "GitHub Copilot review verification ended unexpectedly." >&2
            exit 1
          fi

          read -r -d '' thread_query <<'GRAPHQL' || true
          query(
            $owner: String!
            $repository: String!
            $number: Int!
            $after: String
          ) {
            repository(owner: $owner, name: $repository) {
              pullRequest(number: $number) {
                headRefOid
                reviewThreads(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved
                    comments(first: 1) {
                      nodes { author { login } }
                    }
                  }
                }
              }
            }
          }
          GRAPHQL

          findings_resolved=false
          for resolution_attempt in $(seq 1 20); do
            after=""
            unresolved_copilot_threads=0
            request_failed=false
            while true; do
              arguments=(
                -f query="${thread_query}"
                -F owner="${owner}"
                -F repository="${repository}"
                -F number="${PR_NUMBER}"
              )
              if [ -n "${after}" ]; then
                arguments+=(-f after="${after}")
              fi

              if ! response="$(graphql "${arguments[@]}")"; then
                request_failed=true
                break
              fi

              page_head_sha="$(jq -r '.data.repository.pullRequest.headRefOid // empty' <<<"${response}")"
              if [ "${page_head_sha}" != "${head_sha}" ]; then
                echo "Pull request head changed during thread verification; retrying." >&2
                request_failed=true
                break
              fi

              page_unresolved="$(
                jq \
                  --arg reviewer "${COPILOT_REVIEWER_LOGIN}" \
                  '[
                    (.data.repository.pullRequest.reviewThreads.nodes // [])[]
                    | select(.isResolved == false)
                    | select(
                        (.comments.nodes[0].author.login // "") as $login
                        | ($login == $reviewer or $login == ($reviewer + "[bot]"))
                      )
                  ]
                  | length' <<<"${response}"
              )"
              unresolved_copilot_threads=$((unresolved_copilot_threads + page_unresolved))

              has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"${response}")"
              if [ "${has_next}" != "true" ]; then
                break
              fi
              after="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty' <<<"${response}")"
              if [ -z "${after}" ]; then
                echo "Review-thread pagination cursor is missing." >&2
                exit 1
              fi
            done

            if [ "${request_failed}" = false ] && [ "${unresolved_copilot_threads}" -eq 0 ]; then
              findings_resolved=true
              break
            fi
            if [ "${resolution_attempt}" -eq 20 ]; then
              if [ "${request_failed}" = true ]; then
                echo "Unable to verify Copilot review threads after repeated API or head-change failures." >&2
              else
                echo "${unresolved_copilot_threads} unresolved GitHub Copilot review thread(s) remain." >&2
              fi
              exit 1
            fi
            echo "Waiting for GitHub Copilot findings to be resolved (attempt ${resolution_attempt}/20)."
            sleep 15
          done

          if [ "${findings_resolved}" != true ]; then
            echo "GitHub Copilot thread verification ended unexpectedly." >&2
            exit 1
          fi

          [[ "${review_id}" =~ ^[A-Za-z0-9_+/=-]+$ ]]
          echo "review_id=${review_id}" >>"${GITHUB_OUTPUT}"
          echo "GitHub Copilot reviewed current head ${head_sha}; no unresolved Copilot findings remain."

      - name: Publish bound neutral result
        env:
          BOUND_LAST_EDITED_AT: ${{ steps.metadata-revision.outputs.last_edited_at }}
          BOUND_LABELS_SHA256: ${{ steps.metadata-revision.outputs.labels_sha256 }}
          BOUND_REVIEW_ID: ${{ steps.copilot-review.outputs.review_id }}
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_KIND: ${{ steps.trusted-automation.outputs.kind }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          api_read() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "GitHub API read failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          api_patch() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api --method PATCH "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Idempotent GitHub check update failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          read_metadata_revision() {
            local attempt output
            local owner="${REPOSITORY%%/*}"
            local repository="${REPOSITORY#*/}"
            local query
            read -r -d '' query <<'GRAPHQL' || true
          query($owner: String!, $repository: String!, $number: Int!) {
            repository(owner: $owner, name: $repository) {
              pullRequest(number: $number) {
                number
                lastEditedAt
              }
            }
          }
          GRAPHQL
            for attempt in $(seq 1 5); do
              if output="$(gh api graphql \
                  -f query="${query}" \
                  -F owner="${owner}" \
                  -F repository="${repository}" \
                  -F number="${PR_NUMBER}")" \
                && jq -e \
                  --argjson number "${PR_NUMBER}" '
                    ((.errors // []) | length) == 0
                    and .data.repository.pullRequest.number == $number
                    and (
                      .data.repository.pullRequest.lastEditedAt == null
                      or (
                        (.data.repository.pullRequest.lastEditedAt | type) == "string"
                        and (.data.repository.pullRequest.lastEditedAt |
                          test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
                      )
                    )
                  ' <<<"${output}" >/dev/null; then
                jq -r '.data.repository.pullRequest.lastEditedAt // "null"' \
                  <<<"${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Unable to re-prove the protected pull-request metadata revision." >&2
                return 1
              fi
              sleep 5
            done
          }
          read_labels_sha256() {
            local labels_json live_pr
            live_pr="$(api_read "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" || return 1
            labels_json="$(jq -cer '
              if (.labels | type) == "array"
                and all(.labels[]; type == "object" and (.name | type) == "string")
              then [.labels[].name] | sort
              else error("malformed pull-request labels")
              end
            ' <<<"${live_pr}")" || return 1
            printf '%s' "${labels_json}" | sha256sum | cut -d ' ' -f 1
          }
          validate_bound_review() {
            local attempt reviews
            [[ "${BOUND_REVIEW_ID}" =~ ^[A-Za-z0-9_+/=-]+$ ]] || return 1
            # GitHub can expose a completed review through GraphQL before the
            # REST review collection converges. Re-prove the same immutable
            # review with a bounded read-only wait; never request AI again.
            for attempt in $(seq 1 10); do
              if reviews="$(api_read --paginate --slurp \
                  "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")" \
                && jq -e --arg head "${EVENT_HEAD}" --arg review_id "${BOUND_REVIEW_ID}" '
                  [add[]? | select(.node_id == $review_id)] as $reviews |
                  ($reviews | length) == 1
                  and $reviews[0].commit_id == $head
                  and ($reviews[0].user.login == "copilot-pull-request-reviewer"
                    or $reviews[0].user.login == "copilot-pull-request-reviewer[bot]")
                  and ($reviews[0].state == "COMMENTED" or $reviews[0].state == "APPROVED")
                ' <<<"${reviews}" >/dev/null; then
                return 0
              fi
              if [ "${attempt}" -eq 10 ]; then
                echo "The exact bound Copilot review did not converge across GitHub review APIs." >&2
                return 1
              fi
              sleep 3
            done
          }
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BOUND_LABELS_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${EVENT_HEAD_REPOSITORY}" == */* ]]
          [[ "${BOUND_LAST_EDITED_AT}" == null \
            || "${BOUND_LAST_EDITED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          test "$(read_metadata_revision)" = "${BOUND_LAST_EDITED_AT}"
          test "$(read_labels_sha256)" = "${BOUND_LABELS_SHA256}"
          [[ "${EVENT_BASE_REF}" =~ ^(develop|main)$ ]]
          test "${DEFAULT_BRANCH}" = develop
          test "${TRUSTED_WORKFLOW_REF}" = \
            "${REPOSITORY}/.github/workflows/copilot-review.yml@refs/heads/${EVENT_BASE_REF}"
          test "${TRUSTED_WORKFLOW_SHA}" = "${EVENT_BASE}"
          protected_run="$(gh api "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e \
            --arg branch "${EVENT_HEAD_REF}" \
            --arg head_repository "${EVENT_HEAD_REPOSITORY}" \
            --arg repository "${REPOSITORY}" \
            --arg sha "${EVENT_HEAD}" '
              .event == "pull_request_target"
              and .name == "Current revision review gate"
              and .path == ".github/workflows/copilot-review.yml"
              and .head_branch == $branch
              and .head_sha == $sha
              and .repository.full_name == $repository
              and .head_repository.full_name == $head_repository
            ' <<<"${protected_run}" >/dev/null
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base_ref "${EVENT_BASE_REF}" \
            --arg base_sha "${EVENT_BASE}" \
            --arg body "${EVENT_BODY}" \
            --arg head_ref "${EVENT_HEAD_REF}" \
            --arg head_repository "${EVENT_HEAD_REPOSITORY}" \
            --arg head_sha "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" \
            --arg title "${EVENT_TITLE}" '
              .state == "open"
              and .draft == false
              and .title == $title
              and (.body // "") == $body
              and .base.ref == $base_ref
              and .base.sha == $base_sha
              and .head.ref == $head_ref
              and .head.sha == $head_sha
              and .head.repo.full_name == $head_repository
            ' <<<"${pr}" >/dev/null
          base_ref="$(jq -er '.base.ref | select(. == "develop" or . == "main")' <<<"${pr}")"
          test -n "${base_ref}"
          test "$(jq -r .base.repo.full_name <<<"${pr}")" = "${REPOSITORY}"
          author="$(jq -r .user.login <<<"${pr}")"
          review_path="applicable Copilot or governed automation exemption"
          external_kind="copilot"
          result_title="Current revision review passed"
          if [[ "${TRUSTED_KIND}" =~ ^(shared-assets|repository-quality)$ ]]; then
            test "${REPOSITORY}" != 'lightning-it/.github'
            test "${author}" = 'lightning-it-shared-assets-sync[bot]'
            test "${base_ref}" = develop
            review_path="deterministic provenance-bound managed distribution exemption"
            external_kind="managed-sync"
            result_title="Current revision managed distribution exemption passed"
          elif [ "${TRUSTED_KIND}" = ancestry-backmerge ]; then
            test "${REPOSITORY}" = "lightning-it/.github"
            test "${author}" = 'lightning-it-shared-assets-sync[bot]'
            test "${TRUSTED_KIND}" = ancestry-backmerge
            test "${base_ref}" = develop
            default_head="$(gh api "repos/${REPOSITORY}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)"
            [[ "${EVENT_HEAD_REF}" == backmerge/*-main ]]
            [[ "$(jq -r .title <<<"${pr}")" == \
              "chore(governance): record main ancestry before "* ]]
            head_commit="$(gh api "repos/${REPOSITORY}/git/commits/${EVENT_HEAD}")"
            current_main="$(gh api "repos/${REPOSITORY}/branches/main" --jq .commit.sha)"
            test "${default_head}" = "${EVENT_BASE}"
            jq -e \
              --arg develop "${default_head}" \
              --arg main "${current_main}" \
              '(.parents | length) == 2
               and .parents[0].sha == $develop
               and .parents[1].sha == $main' \
              <<<"${head_commit}" >/dev/null
            commit_response="$(gh api "repos/${REPOSITORY}/commits/${EVENT_HEAD}")"
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg main "${current_main}" '
                .sha == $head
                and (.parents | length) == 2
                and .parents[0].sha == $base
                and .parents[1].sha == $main
                and (.files | length) == 1
                and .files[0].filename == ".lit/main-ancestry.json"
                and (.files[0].status == "added" or .files[0].status == "modified")
                and (.files[0].previous_filename == null)
              ' <<<"${commit_response}" >/dev/null
            evidence_response="$(gh api \
              "repos/${REPOSITORY}/contents/.lit/main-ancestry.json?ref=${EVENT_HEAD}")"
            jq -e '.type == "file" and .encoding == "base64" and (.size > 0)' \
              <<<"${evidence_response}" >/dev/null
            evidence_json="$(jq -r .content <<<"${evidence_response}" | tr -d '\n' | base64 --decode)"
            jq -e \
              --arg repository "${REPOSITORY}" \
              --arg main "${current_main}" \
              --arg develop "${default_head}" '
                (keys | sort) == ["develop_parent_sha", "main_sha", "purpose", "repository", "schema_version"]
                and .schema_version == 1
                and .repository == $repository
                and .main_sha == $main
                and .develop_parent_sha == $develop
                and .purpose == "Bind the reviewed main ancestry backmerge."
              ' <<<"${evidence_json}" >/dev/null
            review_path="deterministic evidence-bound ancestry exemption"
            external_kind="ancestry-backmerge"
            result_title="Current revision deterministic exemption passed"
          else
            test "${TRUSTED_KIND}" != shared-assets
            test "${TRUSTED_KIND}" != repository-quality
            test "${TRUSTED_KIND}" != ancestry-backmerge
            test "${author}" != 'lightning-it-shared-assets-sync[bot]'
            test "${author}" != 'lightning-it-release-automation[bot]'
          fi
          if [ "${external_kind}" = copilot ]; then
            validate_bound_review
          else
            test -z "${BOUND_REVIEW_ID}"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          evidence="$(jq -cn \
            --arg base "${EVENT_BASE}" \
            --arg controller "${TRUSTED_WORKFLOW_SHA}" \
            --arg controller_ref "${EVENT_BASE_REF}" \
            --arg head "${EVENT_HEAD}" \
            --arg head_repository "${EVENT_HEAD_REPOSITORY}" \
            --arg last_edited_at "${BOUND_LAST_EDITED_AT}" \
            --arg labels_sha256 "${BOUND_LABELS_SHA256}" \
            --arg review_id "${BOUND_REVIEW_ID}" \
            --arg review_path "${review_path}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson run_id "${GITHUB_RUN_ID}" \
            --arg run_url "${run_url}" \
            '{schema:4,base_sha:$base,head_sha:$head,head_repository:$head_repository,
              controller_sha:$controller,controller_ref:$controller_ref,
              pull_request_number:$pr_number,producer_run_id:$run_id,
              pull_request_last_edited_at:(
                if $last_edited_at == "null" then null else $last_edited_at end),
              pull_request_labels_sha256:$labels_sha256,
              review_id:(if $review_id == "" then null else $review_id end),
              review_path:$review_path,run_url:$run_url}')"
          publish_once() {
            local check_name="$1" external_id="$2" title="$3"
            local checks named count check_id check_url completed_at created
            local recovered recovery_attempt updated
            read_named_checks() {
              checks="$(api_read --paginate --slurp \
                "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=$(jq -rn --arg value "${check_name}" '$value|@uri')&filter=all&per_page=100")" || return 1
              jq -c \
                --arg name "${check_name}" \
                '[.[].check_runs[]? |
                  select(.name == $name) |
                  select(.app.id == 15368 and .app.slug == "github-actions")]' \
                <<<"${checks}"
            }
            named="$(read_named_checks)"
            count="$(jq 'length' <<<"${named}")"
            if [ "${count}" -gt 1 ]; then
              echo "Multiple protected ${check_name} results exist for ${EVENT_HEAD}." >&2
              exit 1
            fi
            if [ "${count}" -eq 1 ]; then
              if [[ "${EVENT_ACTION}" =~ ^(edited|labeled|unlabeled)$ ]]; then
                reservation_kind="${EVENT_ACTION}"
                if [ "${reservation_kind}" = edited ]; then
                  reservation_kind=edit
                fi
                expected_reservation="mlx90-current-revision:metadata-${reservation_kind}:v1:${PR_NUMBER}:${GITHUB_RUN_ID}:${EVENT_BASE}:${EVENT_HEAD}"
                test "$(jq -r '.[0].external_id // empty' <<<"${named}")" = \
                  "${expected_reservation}"
              fi
              check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${named}")"
              check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
              # A new bound producer must refresh the terminal timestamp. GitHub's
              # strict status policy can otherwise retain the check as expected.
              completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              updated="$(api_patch "repos/${REPOSITORY}/check-runs/${check_id}" \
                -f status=completed \
                -f conclusion=success \
                -f "completed_at=${completed_at}" \
                -f "details_url=${check_url}" \
                -f "external_id=${external_id}" \
                -f "output[title]=${title}" \
                -f "output[summary]=${evidence}")"
              jq -e \
                --arg check_name "${check_name}" \
                --arg completed_at "${completed_at}" \
                --arg evidence "${evidence}" \
                --arg external_id "${external_id}" \
                --arg head "${EVENT_HEAD}" \
                --arg url "${check_url}" \
                --argjson check_id "${check_id}" '
                  .id == $check_id
                  and .name == $check_name
                  and .app.id == 15368
                  and .app.slug == "github-actions"
                  and .head_sha == $head
                  and .details_url == $url
                  and .external_id == $external_id
                  and .completed_at == $completed_at
                  and .status == "completed"
                  and .conclusion == "success"
                  and .output.summary == $evidence
                ' <<<"${updated}" >/dev/null
              printf '%s' "${check_id}"
              return
            fi
            if ! created="$(gh api --method POST "repos/${REPOSITORY}/check-runs" \
                -f name="${check_name}" \
                -f head_sha="${EVENT_HEAD}" \
                -f status=completed \
                -f conclusion=success \
                -f external_id="${external_id}" \
                -f "output[title]=${title}" \
                -f "output[summary]=${evidence}")"; then
              # Never retry a create blindly: GitHub can materialize the check
              # even when the client receives a non-success response. Recover
              # only one exact app/head/external-id result.
              created=''
              for recovery_attempt in $(seq 1 5); do
                echo "Recovering protected check creation outcome (attempt ${recovery_attempt}/5)." >&2
                sleep 5
                named="$(read_named_checks)"
                recovered="$(jq -c \
                  --arg external_id "${external_id}" \
                  --arg head "${EVENT_HEAD}" '
                    [.[] |
                      select(.head_sha == $head) |
                      select(.external_id == $external_id)]
                  ' <<<"${named}")"
                if [ "$(jq 'length' <<<"${named}")" -gt 1 ] \
                  || [ "$(jq 'length' <<<"${recovered}")" -gt 1 ]; then
                  echo "Ambiguous protected check creation outcome." >&2
                  return 1
                fi
                if [ "$(jq 'length' <<<"${recovered}")" -eq 1 ]; then
                  created="$(jq -c '.[0]' <<<"${recovered}")"
                  break
                fi
              done
              if [ -z "${created}" ]; then
                echo "Protected check creation failed without a materialized exact result." >&2
                return 1
              fi
            fi
            check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${created}")"
            check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
            created="$(api_patch "repos/${REPOSITORY}/check-runs/${check_id}" \
              -f "details_url=${check_url}")"
            jq -e \
              --arg evidence "${evidence}" \
              --arg external_id "${external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${check_url}" \
              --argjson check_id "${check_id}" '
                .id == $check_id
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "completed"
                and .conclusion == "success"
                and .output.summary == $evidence
              ' <<<"${created}" >/dev/null
            printf '%s' "${check_id}"
          }
          published_check_id="$(publish_once \
            'Current revision review' \
            "mlx90-current-revision:${external_kind}:v6:${PR_NUMBER}:${GITHUB_RUN_ID}:${EVENT_BASE}:${EVENT_HEAD}" \
            "${result_title}")"
          [[ "${published_check_id}" =~ ^[1-9][0-9]*$ ]]
          final_last_edited_at=''
          final_labels_sha256=''
          final_review_valid=true
          if [ "${external_kind}" = copilot ] && ! validate_bound_review; then
            final_review_valid=false
          fi
          if ! final_last_edited_at="$(read_metadata_revision)" \
            || [ "${final_last_edited_at}" != "${BOUND_LAST_EDITED_AT}" ] \
            || ! final_labels_sha256="$(read_labels_sha256)" \
            || [ "${final_labels_sha256}" != "${BOUND_LABELS_SHA256}" ] \
            || [ "${final_review_valid}" != true ]; then
            failure_evidence="$(jq -cn \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg reason "pull-request metadata, labels, or review state changed during result publication" \
              --argjson pr_number "${PR_NUMBER}" \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --arg run_url "${run_url}" \
              '{schema:4,base_sha:$base,head_sha:$head,pull_request_number:$pr_number,
                producer_run_id:$run_id,reason:$reason,run_url:$run_url}')"
            completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            invalidated="$(api_patch \
              "repos/${REPOSITORY}/check-runs/${published_check_id}" \
              -f status=completed \
              -f conclusion=failure \
              -f "completed_at=${completed_at}" \
              -f "details_url=${run_url}" \
              -f "external_id=mlx90-current-revision:metadata-race:v1:${PR_NUMBER}:${GITHUB_RUN_ID}:${EVENT_BASE}:${EVENT_HEAD}" \
              -f 'output[title]=Current revision metadata changed during publication' \
              -f "output[summary]=${failure_evidence}")"
            jq -e \
              --arg evidence "${failure_evidence}" \
              --arg head "${EVENT_HEAD}" \
              --argjson check_id "${published_check_id}" '
                .id == $check_id
                and .name == "Current revision review"
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .head_sha == $head
                and .status == "completed"
                and .conclusion == "failure"
                and .output.summary == $evidence
              ' <<<"${invalidated}" >/dev/null
            echo "Pull-request metadata, labels, or review state changed during result publication." >&2
            exit 1
          fi

  request-protected-verifier-reevaluation:
    name: Request protected verifier re-evaluation
    needs: verify-current-revision-policy
    if: needs.verify-current-revision-policy.result == 'success'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch the protected re-evaluation helper from develop
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/current-revision-rerun.yml/dispatches" \
            -f ref=develop \
            -f "inputs[pr_number]=${PR_NUMBER}" \
            -f "inputs[expected_base]=${EXPECTED_BASE}" \
            -f "inputs[expected_head]=${EXPECTED_HEAD}" >/dev/null

# yamllint disable rule:truthy
---
name: Trivy

on:
  pull_request:
    paths:
      - "Containerfile"
      - "Dockerfile"
      - ".dockerignore"
      - "packaging/container/**"
      - ".github/workflows/container-trivy.yml"
  push:
    branches: ["develop", "main", "master"]
    paths:
      - "Containerfile"
      - "Dockerfile"
      - ".dockerignore"
      - "packaging/container/**"
      - ".github/workflows/container-trivy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          driver-opts: >-
            image=docker.io/moby/buildkit:buildx-stable-1@sha256:63db51c9b30208a7c2b1c40392c7ebb9ce2f85ba238a18a85420f8f5ea2d4684

      - name: Build local image for Trivy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: ${{ vars.CONTAINER_BUILD_CONTEXT || '.' }}
          file: ${{ vars.CONTAINERFILE_PATH || 'Dockerfile' }}
          push: false
          load: true
          platforms: linux/amd64
          tags: local/${{ github.event.repository.name }}:${{ github.sha }}

      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: local/${{ github.event.repository.name }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1  # v4.37.2
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: local/${{ github.event.repository.name }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

# yamllint disable rule:truthy
---
name: Trivy

on:
  # Trivy is a required branch-protection context and must exist for every PR.
  pull_request: {}
  push:
    branches: ["develop", "main", "master"]
    paths:
      - "Containerfile"
      - "Dockerfile"
      - ".dockerignore"
      - "packaging/container/**"
      - ".github/workflows/container-trivy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
        with:
          driver-opts: >-
            image=docker.io/moby/buildkit:buildx-stable-1@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528

      - name: Build local image for Trivy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: ${{ vars.CONTAINER_BUILD_CONTEXT || '.' }}
          file: ${{ vars.CONTAINERFILE_PATH || 'Dockerfile' }}
          push: false
          load: true
          platforms: linux/amd64
          tags: local/${{ github.event.repository.name }}:${{ github.sha }}

      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: local/${{ github.event.repository.name }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: local/${{ github.event.repository.name }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

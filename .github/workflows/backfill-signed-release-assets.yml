# yamllint disable rule:truthy rule:line-length
---
name: Backfill Signed Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional single release tag to backfill. Empty scans the latest 30 releases.
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  backfill:
    name: Backfill release provenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Backfill missing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ -n "$RELEASE_TAG" ]]; then
            mapfile -t tags < <(printf '%s\n' "$RELEASE_TAG")
          else
            mapfile -t tags < <(gh release list --limit 30 --json tagName --jq '.[].tagName')
          fi

          for tag in "${tags[@]}"; do
            echo "Inspecting $tag"
            mapfile -t assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
            if [[ "${#assets[@]}" -eq 0 ]]; then
              echo "Skipping $tag: no release assets"
              continue
            fi

            has_intoto=false
            has_sha=false
            has_sha_sigstore=false
            for asset in "${assets[@]}"; do
              [[ "$asset" == *.intoto.jsonl ]] && has_intoto=true
              [[ "$asset" == "SHA256SUMS" ]] && has_sha=true
              [[ "$asset" == "SHA256SUMS.sigstore.json" ]] && has_sha_sigstore=true
            done

            if [[ "$has_intoto" == true && "$has_sha" == true && "$has_sha_sigstore" == true ]]; then
              echo "Skipping $tag: signed release assets already complete"
              continue
            fi

            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT
            gh release download "$tag" --dir "$work" --clobber

            subjects=()
            while IFS= read -r -d '' path; do
              case "$(basename "$path")" in
                release-provenance.intoto.jsonl|SHA256SUMS|SHA256SUMS.sigstore.json) ;;
                *) subjects+=(--subject "$path") ;;
              esac
            done < <(find "$work" -maxdepth 1 -type f -print0 | sort -z)

            python3 scripts/generate-release-provenance.py \
              --mode retroactive-release-asset-provenance \
              --release-tag "$tag" \
              --commit "$GITHUB_SHA" \
              --output "$work/release-provenance.intoto.jsonl" \
              "${subjects[@]}"

            (
              cd "$work"
              find . -maxdepth 1 -type f \
                ! -name release-provenance.intoto.jsonl \
                ! -name SHA256SUMS \
                ! -name SHA256SUMS.sigstore.json \
                -printf '%f\0' \
                | sort -z \
                | xargs -0 sha256sum > SHA256SUMS
              cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
            )

            upload=()
            [[ "$has_intoto" == false ]] && upload+=("$work/release-provenance.intoto.jsonl")
            [[ "$has_sha" == false ]] && upload+=("$work/SHA256SUMS")
            [[ "$has_sha_sigstore" == false ]] && upload+=("$work/SHA256SUMS.sigstore.json")

            if [[ "${#upload[@]}" -gt 0 ]]; then
              gh release upload "$tag" "${upload[@]}"
              echo "Uploaded ${#upload[@]} missing asset(s) for $tag"
            fi
            rm -rf "$work"
            trap - EXIT
          done

# yamllint disable rule:truthy rule:line-length
---
name: Shared-assets guarded automerge

on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
      ]
  workflow_run:
    workflows: ["Re-evaluate protected current-revision evidence"]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  classify-shared-assets-invocation:
    name: Classify protected shared-assets finalizer invocation
    if: >-
      (
        github.event_name == 'pull_request'
        && github.event.pull_request.user.login
          == 'lightning-it-shared-assets-sync[bot]'
        && github.event.pull_request.head.repo.full_name == github.repository
        && !(
          github.repository == 'lightning-it/.github'
          && github.event.pull_request.base.ref == 'develop'
          && startsWith(github.event.pull_request.head.ref, 'backmerge/')
          && endsWith(github.event.pull_request.head.ref, '-main')
          && startsWith(
            github.event.pull_request.title,
            'chore(governance): record main ancestry before '
          )
        )
      )
      ||
      (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'workflow_dispatch'
        && github.event.workflow_run.status == 'completed'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.path
          == '.github/workflows/current-revision-rerun.yml'
        && github.event.workflow_run.head_branch == 'develop'
        && github.event.workflow_run.run_attempt == 1
        && github.event.workflow_run.actor.login == 'github-actions[bot]'
        && github.event.workflow_run.triggering_actor.login
          == 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      accepted: ${{ steps.classify.outputs.accepted }}
      author: ${{ steps.classify.outputs.author }}
      base_ref: ${{ steps.classify.outputs.base_ref }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_ref: ${{ steps.classify.outputs.head_ref }}
      head_repo: ${{ steps.classify.outputs.head_repo }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      pr_number: ${{ steps.classify.outputs.pr_number }}
      title: ${{ steps.classify.outputs.title }}

    steps:
      - name: Bind event, protected helper and live pull request
        id: classify
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
          HELPER_ACTOR: ${{ github.event.workflow_run.actor.login }}
          HELPER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HELPER_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          HELPER_EVENT: ${{ github.event.workflow_run.event }}
          HELPER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HELPER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HELPER_PATH: ${{ github.event.workflow_run.path }}
          HELPER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HELPER_RUN_ID: ${{ github.event.workflow_run.id }}
          HELPER_STATUS: ${{ github.event.workflow_run.status }}
          HELPER_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          LISTENER_REF: ${{ github.ref }}
          LISTENER_REF_PROTECTED: ${{ github.ref_protected }}
          LISTENER_SHA: ${{ github.sha }}
          LISTENER_WORKFLOW_REF: ${{ github.workflow_ref }}
          LISTENER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          readonly SYNC_APP_BOT="lightning-it-shared-assets-sync[bot]"
          case "${EVENT_NAME}" in
            pull_request)
              test "${EVENT_ACTOR}" = "${SYNC_APP_BOT}"
              test "${EVENT_TRIGGERING_ACTOR}" = "${SYNC_APP_BOT}"
              pr_number="${EVENT_PR_NUMBER}"
              expected_base="${EVENT_BASE_SHA}"
              expected_head="${EVENT_HEAD_SHA}"
              base_ref="${EVENT_BASE_REF}"
              ;;
            workflow_run)
              [[ "${EVENT_DEFAULT_BRANCH}" =~ ^(develop|main)$ ]]
              [[ "${LISTENER_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
              test "${LISTENER_REF_PROTECTED}" = true
              test "${LISTENER_REF}" = "refs/heads/${EVENT_DEFAULT_BRANCH}"
              test "${LISTENER_SHA}" = "${LISTENER_WORKFLOW_SHA}"
              test "${LISTENER_WORKFLOW_REF}" = \
                "${REPO}/.github/workflows/shared-assets-guarded-automerge.yml@${LISTENER_REF}"
              live_repository="$(gh api "repos/${REPO}")"
              jq -e \
                --arg default_branch "${EVENT_DEFAULT_BRANCH}" \
                --arg repository "${REPO}" '
                .full_name == $repository
                and .default_branch == $default_branch
              ' <<<"${live_repository}" >/dev/null
              live_default_branch="$(gh api \
                "repos/${REPO}/branches/${EVENT_DEFAULT_BRANCH}")"
              jq -e \
                --arg default_branch "${EVENT_DEFAULT_BRANCH}" \
                --arg workflow_sha "${LISTENER_WORKFLOW_SHA}" '
                .name == $default_branch
                and .protected == true
                and .commit.sha == $workflow_sha
              ' <<<"${live_default_branch}" >/dev/null
              test "${HELPER_ACTOR}" = 'github-actions[bot]'
              test "${HELPER_TRIGGERING_ACTOR}" = 'github-actions[bot]'
              test "${HELPER_EVENT}" = workflow_dispatch
              test "${HELPER_STATUS}" = completed
              test "${HELPER_CONCLUSION}" = success
              test "${HELPER_PATH}" = '.github/workflows/current-revision-rerun.yml'
              test "${HELPER_HEAD_BRANCH}" = develop
              test "${HELPER_RUN_ATTEMPT}" = 1
              [[ "${HELPER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              test "${HELPER_RUN_ID}" != "${GITHUB_RUN_ID}"
              if [[ "${HELPER_DISPLAY_TITLE}" =~ ^Protected\ verifier\ handoff\ PR\ \#([1-9][0-9]*)\ producer\ ([1-9][0-9]*)\ head\ ([0-9a-f]{40})$ ]]; then
                pr_number="${BASH_REMATCH[1]}"
                expected_head="${BASH_REMATCH[3]}"
              else
                echo "Malformed protected helper title binding." >&2
                exit 1
              fi
              expected_base="${HELPER_HEAD_SHA}"
              base_ref=develop
              helper="$(gh api "repos/${REPO}/actions/runs/${HELPER_RUN_ID}")"
              jq -e \
                --arg api_url "${GITHUB_API_URL}" \
                --arg base_ref "${base_ref}" \
                --arg base_sha "${expected_base}" \
                --arg repository "${REPO}" \
                --arg title "${HELPER_DISPLAY_TITLE}" \
                --argjson run_id "${HELPER_RUN_ID}" '
                .id == $run_id
                and .event == "workflow_dispatch"
                and .path == ".github/workflows/current-revision-rerun.yml"
                and .head_branch == $base_ref
                and .head_sha == $base_sha
                and .run_attempt == 1
                and .display_title == $title
                and .actor.login == "github-actions[bot]"
                and .triggering_actor.login == "github-actions[bot]"
                and .url == ($api_url + "/repos/" + $repository
                  + "/actions/runs/" + ($run_id | tostring))
                and .status == "completed" and .conclusion == "success"
              ' <<<"${helper}" >/dev/null
              helper_jobs="$(gh api --paginate --slurp \
                "repos/${REPO}/actions/runs/${HELPER_RUN_ID}/jobs?filter=all&per_page=100")"
              jq -e '
                [ .[] | .jobs[]
                  | select(.name == "Re-run the one protected verifier attempt")
                ] as $matches
                | ($matches | length) == 1
                and $matches[0].run_attempt == 1
                and ($matches[0].runner_id | type) == "number"
                and $matches[0].runner_id > 0
                and ($matches[0].steps | type) == "array"
                and ($matches[0].steps | length) > 0
                and $matches[0].status == "completed"
                and $matches[0].conclusion == "success"
              ' <<<"${helper_jobs}" >/dev/null
              ;;
            *)
              echo "Unsupported shared-assets finalizer event." >&2
              exit 1
              ;;
          esac

          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]
          [[ "${expected_base}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${expected_head}" =~ ^[0-9a-f]{40}$ ]]
          test "${base_ref}" = develop
          live_pr="$(gh api "repos/${REPO}/pulls/${pr_number}")"
          jq -e \
            --arg author "${SYNC_APP_BOT}" \
            --arg base_ref "${base_ref}" \
            --arg base_sha "${expected_base}" \
            --arg head_sha "${expected_head}" \
            --arg repository "${REPO}" \
            --argjson pr_number "${pr_number}" '
            .number == $pr_number
            and .state == "open" and .draft == false
            and .user.login == $author
            and .base.ref == $base_ref and .base.sha == $base_sha
            and .head.repo.full_name == $repository
            and .head.sha == $head_sha
            and ([.labels[].name] | index("chore") != null)
            and ([.labels[].name] | index("shared-assets-lit") != null)
          ' <<<"${live_pr}" >/dev/null
          head_ref="$(jq -er '.head.ref | select(type == "string")' \
            <<<"${live_pr}")"
          head_repo="$(jq -er '.head.repo.full_name | select(type == "string")' \
            <<<"${live_pr}")"
          title="$(jq -er '.title | select(type == "string")' <<<"${live_pr}")"
          repo_name="${REPO#*/}"
          repository_quality_prefix="chore/sync-repository-quality-${repo_name}-"
          shared_assets_prefix="chore/sync-shared-assets-lit-${repo_name}-"
          if [[ "${head_ref}" == "${repository_quality_prefix}"* ]] \
            && [[ "${head_ref#"${repository_quality_prefix}"}" \
              =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] \
            && [ "${title}" = "chore: sync repository quality assets" ]; then
            :
          elif [[ "${head_ref}" == "${shared_assets_prefix}"* ]] \
            && [[ "${head_ref#"${shared_assets_prefix}"}" \
              =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] \
            && { [ "${title}" = "chore: sync shared-assets-lit" ] \
              || [ "${title}" = "chore: sync shared assets" ]; }; then
            :
          else
            echo "Unsupported trusted shared-assets PR shape." >&2
            exit 1
          fi

          if [ "${EVENT_NAME}" = pull_request ]; then
            test "${EVENT_PR_AUTHOR}" = "${SYNC_APP_BOT}"
            test "${EVENT_PR_NUMBER}" = "${pr_number}"
            test "${EVENT_BASE_REF}" = "${base_ref}"
            test "${EVENT_BASE_SHA}" = "${expected_base}"
            test "${EVENT_HEAD_REF}" = "${head_ref}"
            test "${EVENT_HEAD_REPO}" = "${head_repo}"
            test "${EVENT_HEAD_SHA}" = "${expected_head}"
            test "${EVENT_PR_TITLE}" = "${title}"
          fi

          {
            echo 'accepted=true'
            echo "author=${SYNC_APP_BOT}"
            echo "base_ref=${base_ref}"
            echo "base_sha=${expected_base}"
            echo "head_ref=${head_ref}"
            echo "head_repo=${head_repo}"
            echo "head_sha=${expected_head}"
            echo "pr_number=${pr_number}"
            echo "title=${title}"
          } >>"${GITHUB_OUTPUT}"

  verify-shared-assets:
    name: Verify trusted shared-assets PR
    needs: classify-shared-assets-invocation
    if: >-
      needs.classify-shared-assets-invocation.result == 'success'
      && needs.classify-shared-assets-invocation.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      trusted: ${{ steps.guard.outputs.trusted }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Verify automated sync PR identity
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ needs.classify-shared-assets-invocation.outputs.author }}
          PR_BASE: ${{ needs.classify-shared-assets-invocation.outputs.base_ref }}
          PR_HEAD: ${{ needs.classify-shared-assets-invocation.outputs.head_ref }}
          PR_HEAD_SHA: ${{ needs.classify-shared-assets-invocation.outputs.head_sha }}
          PR_HEAD_REPO: ${{ needs.classify-shared-assets-invocation.outputs.head_repo }}
          PR_NUMBER: ${{ needs.classify-shared-assets-invocation.outputs.pr_number }}
          PR_TITLE: ${{ needs.classify-shared-assets-invocation.outputs.title }}
          REPO: ${{ github.repository }}
          SYNC_APP_ID: ${{ vars.SHARED_ASSETS_SYNC_APP_ID }}
          TRIGGER_ACTOR: >-
            ${{ github.event.workflow_run.actor.login || github.actor }}
          TRIGGERING_ACTOR: >-
            ${{ github.event.workflow_run.triggering_actor.login
                || github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          readonly SYNC_APP_BOT="lightning-it-shared-assets-sync[bot]"
          trusted=true
          sync_kind=none
          expected_subject=""
          repo_name="${REPO#*/}"
          repository_quality_prefix="chore/sync-repository-quality-${repo_name}-"
          shared_assets_prefix="chore/sync-shared-assets-lit-${repo_name}-"

          # Draft/Ready is mutable, and concurrent PR events can arrive out of
          # order. The live PR read below is the only authoritative state.
          if ! [[ "$SYNC_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            trusted=false
          fi

          case "${EVENT_NAME}:${TRIGGER_ACTOR}:${TRIGGERING_ACTOR}" in
            pull_request:"${SYNC_APP_BOT}":"${SYNC_APP_BOT}"|workflow_run:"github-actions[bot]":"github-actions[bot]") ;;
            *) trusted=false ;;
          esac

          if [ "$PR_AUTHOR" != "$SYNC_APP_BOT" ]; then
            trusted=false
          fi

          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            trusted=false
          fi

          if [ "$PR_BASE" != "develop" ]; then
            trusted=false
          fi

          if [[ "$PR_HEAD" == "$repository_quality_prefix"* ]] \
            && [[ "${PR_HEAD#"$repository_quality_prefix"}" \
              =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] \
            && [ "$PR_TITLE" = "chore: sync repository quality assets" ]; then
            sync_kind=repository-quality
            expected_subject="chore: sync repository quality assets"
          elif [[ "$PR_HEAD" == "$shared_assets_prefix"* ]] \
            && [[ "${PR_HEAD#"$shared_assets_prefix"}" \
              =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] \
            && { [ "$PR_TITLE" = "chore: sync shared-assets-lit" ] \
              || [ "$PR_TITLE" = "chore: sync shared assets" ]; }; then
            sync_kind=shared-assets
            expected_subject="chore: sync shared assets from lightning-it/shared-assets-lit"
          else
            trusted=false
          fi

          live_pr="{}"
          if ! live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"; then
            trusted=false
          fi
          if ! jq -e \
            --arg author "$PR_AUTHOR" \
            --arg base "$PR_BASE" \
            --arg head "$PR_HEAD" \
            --arg head_repo "$PR_HEAD_REPO" \
            --arg head_sha "$PR_HEAD_SHA" \
            --arg title "$PR_TITLE" \
            '(.state == "open") and (.draft == false)
             and (.user.login == $author) and (.base.ref == $base)
             and (.head.ref == $head) and (.head.repo.full_name == $head_repo)
             and (.head.sha == $head_sha) and (.title == $title)
             and ([.labels[].name] | index("chore") != null)
             and ([.labels[].name] | index("shared-assets-lit") != null)' \
            >/dev/null <<<"$live_pr"; then
            trusted=false
          fi

          commit_rows=""
          if ! commit_rows="$(
            gh api --paginate \
              "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
              --jq '.[] | @base64'
          )"; then
            trusted=false
          fi
          expected_commits="$(jq -r '.commits // 0' <<<"$live_pr")"
          actual_commits="$(awk 'NF { count++ } END { print count + 0 }' \
            <<<"$commit_rows")"
          if [ "$actual_commits" -eq 0 ] \
            || [ "$actual_commits" -ne "$expected_commits" ]; then
            trusted=false
          fi
          last_commit_sha=""
          while IFS= read -r encoded_commit; do
            [ -n "$encoded_commit" ] || continue
            commit_json="$(base64 --decode <<<"$encoded_commit")"
            commit_sha="$(jq -r '.sha // ""' <<<"$commit_json")"
            commit_author="$(jq -r '.author.login // ""' <<<"$commit_json")"
            commit_committer="$(jq -r '.committer.login // ""' <<<"$commit_json")"
            commit_message="$(jq -r '.commit.message // ""' <<<"$commit_json")"
            first_line="$(head -n 1 <<<"$commit_message")"
            source_sha_count="$(awk \
              '/^Shared-Assets-Source-SHA: [0-9a-f]{40}$/ { count++ }
               END { print count + 0 }' <<<"$commit_message")"
            source_run_count="$(awk \
              '/^Shared-Assets-Source-Run: [1-9][0-9]*$/ { count++ }
               END { print count + 0 }' <<<"$commit_message")"
            source_attempt_count="$(awk \
              '/^Shared-Assets-Source-Attempt: [1-9][0-9]*$/ { count++ }
               END { print count + 0 }' <<<"$commit_message")"
            app_id_count="$(awk -v expected="$SYNC_APP_ID" \
              '$0 == "Shared-Assets-Sync-App-ID: " expected { count++ }
               END { print count + 0 }' <<<"$commit_message")"
            managed_trailer_count="$(awk \
              '/^Shared-Assets-/ { count++ }
               END { print count + 0 }' <<<"$commit_message")"
            if ! [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] \
              || [ "$commit_author" != "$SYNC_APP_BOT" ] \
              || [ "$commit_committer" != "$SYNC_APP_BOT" ] \
              || [ "$first_line" != "$expected_subject" ] \
              || [ "$source_sha_count" -ne 1 ] \
              || [ "$source_run_count" -ne 1 ] \
              || [ "$source_attempt_count" -ne 1 ] \
              || [ "$app_id_count" -ne 1 ] \
              || [ "$managed_trailer_count" -ne 4 ]; then
              trusted=false
            fi
            last_commit_sha="$commit_sha"
          done <<<"$commit_rows"
          if [ "$last_commit_sha" != "$PR_HEAD_SHA" ]; then
            trusted=false
          fi

          {
            echo "trusted=$trusted"
            echo "kind=$sync_kind"
            echo "subject=$expected_subject"
          } >>"$GITHUB_OUTPUT"

      - name: Revoke auto-merge for an untrusted state or event
        if: steps.guard.outputs.trusted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.classify-shared-assets-invocation.outputs.pr_number }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.classify-shared-assets-invocation.outputs.pr_number }}
          REPO: ${{ github.repository }}
          SYNC_APP_BOT: lightning-it-shared-assets-sync[bot]
          SYNC_APP_ID: ${{ vars.SHARED_ASSETS_SYNC_APP_ID }}
        run: |
          set -euo pipefail

          current_live_is_safe() {
            local actual_commits commit_author commit_committer commit_json
            local commit_message commit_rows commit_sha expected_commits first_line
            local expected_subject last_commit_sha live_head live_head_sha live_pr
            local live_title repo_name source_run_count source_app_id_count
            local managed_trailer_count source_attempt_count
            local source_sha_count

            if ! live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"; then
              return 1
            fi
            if ! jq -e \
              --arg repo "$REPO" \
              '(.state == "open") and (.draft == false)
               and (.user.login == env.SYNC_APP_BOT)
               and (.base.ref == "develop")
               and ((.head.ref | startswith("chore/sync-shared-assets-lit-"))
                    or (.head.ref | startswith("chore/sync-repository-quality-")))
               and (.head.repo.full_name == $repo)
               and ((.title == "chore: sync shared-assets-lit")
                    or (.title == "chore: sync shared assets")
                    or (.title == "chore: sync repository quality assets"))
               and ([.labels[].name] | index("chore") != null)
               and ([.labels[].name] | index("shared-assets-lit") != null)' \
              >/dev/null <<<"$live_pr"; then
              return 1
            fi
            live_head_sha="$(jq -r '.head.sha // ""' <<<"$live_pr")"
            live_head="$(jq -r '.head.ref // ""' <<<"$live_pr")"
            live_title="$(jq -r '.title // ""' <<<"$live_pr")"
            repo_name="${REPO#*/}"
            repository_quality_prefix="chore/sync-repository-quality-${repo_name}-"
            shared_assets_prefix="chore/sync-shared-assets-lit-${repo_name}-"
            if ! [[ "$live_head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              return 1
            fi
            if [[ "$live_head" == "$repository_quality_prefix"* ]] \
              && [[ "${live_head#"$repository_quality_prefix"}" \
                =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] \
              && [ "$live_title" = "chore: sync repository quality assets" ]; then
              expected_subject="chore: sync repository quality assets"
            elif [[ "$live_head" == "$shared_assets_prefix"* ]] \
              && [[ "${live_head#"$shared_assets_prefix"}" \
                =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] \
              && { [ "$live_title" = "chore: sync shared-assets-lit" ] \
                || [ "$live_title" = "chore: sync shared assets" ]; }; then
              expected_subject="chore: sync shared assets from lightning-it/shared-assets-lit"
            else
              return 1
            fi
            if ! commit_rows="$(
              gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[] | @base64'
            )"; then
              return 1
            fi
            expected_commits="$(jq -r '.commits // 0' <<<"$live_pr")"
            actual_commits="$(awk 'NF { count++ } END { print count + 0 }' \
              <<<"$commit_rows")"
            if [ "$actual_commits" -eq 0 ] \
              || [ "$actual_commits" -ne "$expected_commits" ]; then
              return 1
            fi
            last_commit_sha=""
            while IFS= read -r encoded_commit; do
              [ -n "$encoded_commit" ] || continue
              if ! commit_json="$(base64 --decode <<<"$encoded_commit")"; then
                return 1
              fi
              commit_sha="$(jq -r '.sha // ""' <<<"$commit_json")"
              commit_author="$(jq -r '.author.login // ""' <<<"$commit_json")"
              commit_committer="$(jq -r '.committer.login // ""' <<<"$commit_json")"
              commit_message="$(jq -r '.commit.message // ""' <<<"$commit_json")"
              first_line="$(head -n 1 <<<"$commit_message")"
              source_sha_count="$(awk \
                '/^Shared-Assets-Source-SHA: [0-9a-f]{40}$/ { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              source_run_count="$(awk \
                '/^Shared-Assets-Source-Run: [1-9][0-9]*$/ { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              source_attempt_count="$(awk \
                '/^Shared-Assets-Source-Attempt: [1-9][0-9]*$/ { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              source_app_id_count="$(awk -v expected="$SYNC_APP_ID" \
                '$0 == "Shared-Assets-Sync-App-ID: " expected { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              managed_trailer_count="$(awk \
                '/^Shared-Assets-/ { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              if ! [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] \
                || [ "$commit_author" != "$SYNC_APP_BOT" ] \
                || [ "$commit_committer" != "$SYNC_APP_BOT" ] \
                || [ "$first_line" != "$expected_subject" ] \
                || [ "$source_sha_count" -ne 1 ] \
                || [ "$source_run_count" -ne 1 ] \
                || [ "$source_attempt_count" -ne 1 ] \
                || [ "$source_app_id_count" -ne 1 ] \
                || [ "$managed_trailer_count" -ne 4 ]; then
                return 1
              fi
              last_commit_sha="$commit_sha"
            done <<<"$commit_rows"
            [ "$last_commit_sha" = "$live_head_sha" ]
          }

          if current_live_is_safe; then
            echo "Current live PR state is safe; no revocation is needed."
            exit 0
          fi

          owner="${REPO%%/*}"
          name="${REPO#*/}"
          query_auto_merge() {
            gh api graphql \
              -f query="query(\$owner:String!,\$name:String!,\$number:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$number){autoMergeRequest{__typename}}}}" \
              -f owner="$owner" \
              -f name="$name" \
              -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.autoMergeRequest != null'
          }
          auto_merge_enabled="$(query_auto_merge)"
          case "$auto_merge_enabled" in
            true)
              if ! disable_error="$(
                gh pr merge "$PR_URL" --disable-auto 2>&1
              )"; then
                auto_merge_enabled="$(query_auto_merge)"
                if [ "$auto_merge_enabled" != false ]; then
                  printf '%s\n' "$disable_error" >&2
                  exit 1
                fi
              fi
              ;;
            false) ;;
            *)
              echo "ERROR: unable to determine auto-merge state for ${PR_URL}." >&2
              exit 1
              ;;
          esac

      - name: Verify exact provenance before merge finalization
        if: steps.guard.outputs.trusted == 'true'
        env:
          EXPECTED_SUBJECT: ${{ steps.guard.outputs.subject }}
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ needs.classify-shared-assets-invocation.outputs.author }}
          PR_BASE: ${{ needs.classify-shared-assets-invocation.outputs.base_ref }}
          PR_BASE_SHA: ${{ needs.classify-shared-assets-invocation.outputs.base_sha }}
          PR_HEAD: ${{ needs.classify-shared-assets-invocation.outputs.head_ref }}
          PR_HEAD_REPO: ${{ needs.classify-shared-assets-invocation.outputs.head_repo }}
          PR_HEAD_SHA: ${{ needs.classify-shared-assets-invocation.outputs.head_sha }}
          PR_NUMBER: ${{ needs.classify-shared-assets-invocation.outputs.pr_number }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.classify-shared-assets-invocation.outputs.pr_number }}
          PR_TITLE: ${{ needs.classify-shared-assets-invocation.outputs.title }}
          REPO: ${{ github.repository }}
          SYNC_APP_BOT: lightning-it-shared-assets-sync[bot]
          SYNC_APP_ID: ${{ vars.SHARED_ASSETS_SYNC_APP_ID }}
        run: |
          set -euo pipefail

          assert_live_safe() {
            local actual_commits commit_author commit_committer commit_json
            local commit_message commit_rows commit_sha expected_commits first_line
            local last_commit_sha live_pr source_run_count source_sha_count source_app_id_count
            local managed_trailer_count source_attempt_count

            if ! live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"; then
              return 1
            fi
            if ! jq -e \
              --arg author "$PR_AUTHOR" \
              --arg base "$PR_BASE" \
              --arg base_sha "$PR_BASE_SHA" \
              --arg head "$PR_HEAD" \
              --arg head_repo "$PR_HEAD_REPO" \
              --arg head_sha "$PR_HEAD_SHA" \
              --arg title "$PR_TITLE" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.base.sha == $base_sha) and (.head.ref == $head)
               and (.head.repo.full_name == $head_repo)
               and (.head.sha == $head_sha) and (.title == $title)
               and ([.labels[].name] | index("chore") != null)
               and ([.labels[].name] | index("shared-assets-lit") != null)' \
              >/dev/null <<<"$live_pr"; then
              return 1
            fi
            if ! commit_rows="$(
              gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[] | @base64'
            )"; then
              return 1
            fi
            expected_commits="$(jq -r '.commits // 0' <<<"$live_pr")"
            actual_commits="$(awk 'NF { count++ } END { print count + 0 }' \
              <<<"$commit_rows")"
            if [ "$actual_commits" -eq 0 ] \
              || [ "$actual_commits" -ne "$expected_commits" ]; then
              return 1
            fi
            last_commit_sha=""
            while IFS= read -r encoded_commit; do
              [ -n "$encoded_commit" ] || continue
              if ! commit_json="$(base64 --decode <<<"$encoded_commit")"; then
                return 1
              fi
              commit_sha="$(jq -r '.sha // ""' <<<"$commit_json")"
              commit_author="$(jq -r '.author.login // ""' <<<"$commit_json")"
              commit_committer="$(jq -r '.committer.login // ""' <<<"$commit_json")"
              commit_message="$(jq -r '.commit.message // ""' <<<"$commit_json")"
              first_line="$(head -n 1 <<<"$commit_message")"
              source_sha_count="$(awk \
                '/^Shared-Assets-Source-SHA: [0-9a-f]{40}$/ { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              source_run_count="$(awk \
                '/^Shared-Assets-Source-Run: [1-9][0-9]*$/ { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              source_attempt_count="$(awk \
                '/^Shared-Assets-Source-Attempt: [1-9][0-9]*$/ { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              source_app_id_count="$(awk -v expected="$SYNC_APP_ID" \
                '$0 == "Shared-Assets-Sync-App-ID: " expected { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              managed_trailer_count="$(awk \
                '/^Shared-Assets-/ { count++ }
                 END { print count + 0 }' <<<"$commit_message")"
              if ! [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] \
                || [ "$commit_author" != "$SYNC_APP_BOT" ] \
                || [ "$commit_committer" != "$SYNC_APP_BOT" ] \
                || [ "$first_line" != "$EXPECTED_SUBJECT" ] \
                || [ "$source_sha_count" -ne 1 ] \
                || [ "$source_run_count" -ne 1 ] \
                || [ "$source_attempt_count" -ne 1 ] \
                || [ "$source_app_id_count" -ne 1 ] \
                || [ "$managed_trailer_count" -ne 4 ]; then
                return 1
              fi
              last_commit_sha="$commit_sha"
            done <<<"$commit_rows"
            [ "$last_commit_sha" = "$PR_HEAD_SHA" ]
          }

          disable_auto_merge() {
            local auto_merge_enabled disable_error name owner
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            query_auto_merge() {
              gh api graphql \
                -f query="query(\$owner:String!,\$name:String!,\$number:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$number){autoMergeRequest{__typename}}}}" \
                -f owner="$owner" \
                -f name="$name" \
                -F number="$PR_NUMBER" \
                --jq '.data.repository.pullRequest.autoMergeRequest != null'
            }
            if auto_merge_enabled="$(query_auto_merge)"; then
              [ "$auto_merge_enabled" = false ] && return 0
            fi
            disable_error=""
            if ! disable_error="$(
              gh pr merge "$PR_URL" --disable-auto 2>&1
            )"; then
              :
            fi
            if ! auto_merge_enabled="$(query_auto_merge)"; then
              [ -z "$disable_error" ] || printf '%s\n' "$disable_error" >&2
              return 1
            fi
            if [ "$auto_merge_enabled" != false ]; then
              [ -z "$disable_error" ] || printf '%s\n' "$disable_error" >&2
              return 1
            fi
          }

          if ! assert_live_safe; then
            disable_auto_merge
            exit 1
          fi
          # Clear any stale native auto-merge request before this required guard
          # completes. The separate finalizer starts only after this job is
          # durably successful, so the merge cannot wait on its own running
          # required check.
          # A prior cancelled guard check can make GitHub report the PR as
          # unstable and deadlock a new --auto request even after every required
          # check has passed. A normal exact-head merge still enforces every
          # branch rule and grants no bypass.
          disable_auto_merge
          if ! assert_live_safe; then
            disable_auto_merge
            exit 1
          fi
          echo "Exact PR provenance is ready for the post-guard finalizer."

  finalize-shared-assets-merge:
    name: Finalize exact trusted shared-assets merge
    needs: [classify-shared-assets-invocation, verify-shared-assets]
    if: >-
      needs.classify-shared-assets-invocation.result == 'success'
      && needs.classify-shared-assets-invocation.outputs.accepted == 'true'
      && needs.verify-shared-assets.result == 'success'
      && needs.verify-shared-assets.outputs.trusted == 'true'
      && needs.classify-shared-assets-invocation.outputs.author
        == 'lightning-it-shared-assets-sync[bot]'
      && needs.classify-shared-assets-invocation.outputs.head_repo
        == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read

    steps:
      - name: Mint finalizer policy-read App token
        id: policy-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SHARED_ASSETS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SHARED_ASSETS_SYNC_APP_PRIVATE_KEY }}
          permission-administration: read

      - name: Re-prove completed guard and merge exact head
        env:
          CONTROLLER_SHA: ${{ github.workflow_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ needs.classify-shared-assets-invocation.outputs.author }}
          PR_BASE: ${{ needs.classify-shared-assets-invocation.outputs.base_ref }}
          PR_BASE_SHA: ${{ needs.classify-shared-assets-invocation.outputs.base_sha }}
          PR_HEAD: ${{ needs.classify-shared-assets-invocation.outputs.head_ref }}
          PR_HEAD_REPO: ${{ needs.classify-shared-assets-invocation.outputs.head_repo }}
          PR_HEAD_SHA: ${{ needs.classify-shared-assets-invocation.outputs.head_sha }}
          PR_NUMBER: ${{ needs.classify-shared-assets-invocation.outputs.pr_number }}
          PR_TITLE: ${{ needs.classify-shared-assets-invocation.outputs.title }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.classify-shared-assets-invocation.outputs.pr_number }}
          POLICY_TOKEN: ${{ steps.policy-app.outputs.token }}
          REPO: ${{ github.repository }}
          SYNC_APP_BOT: lightning-it-shared-assets-sync[bot]
        run: |
          set -euo pipefail

          assert_live_safe() {
            local live_pr repo_name repository_quality_prefix shared_assets_prefix
            if ! live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"; then
              return 1
            fi
            if ! jq -e \
              --arg author "$PR_AUTHOR" \
              --arg base "$PR_BASE" \
              --arg base_sha "$PR_BASE_SHA" \
              --arg head "$PR_HEAD" \
              --arg head_repo "$PR_HEAD_REPO" \
              --arg head_sha "$PR_HEAD_SHA" \
              --arg title "$PR_TITLE" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.base.sha == $base_sha) and (.head.ref == $head)
               and (.head.repo.full_name == $head_repo)
               and (.head.sha == $head_sha) and (.title == $title)
               and ([.labels[].name] | index("chore") != null)
               and ([.labels[].name] | index("shared-assets-lit") != null)' \
              >/dev/null <<<"$live_pr"; then
              return 1
            fi
            repo_name="${REPO#*/}"
            repository_quality_prefix="chore/sync-repository-quality-${repo_name}-"
            shared_assets_prefix="chore/sync-shared-assets-lit-${repo_name}-"
            if [[ "$PR_HEAD" == "$repository_quality_prefix"* ]] \
              && [[ "${PR_HEAD#"$repository_quality_prefix"}" \
                =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] \
              && [ "$PR_TITLE" = "chore: sync repository quality assets" ]; then
              return 0
            fi
            [[ "$PR_HEAD" == "$shared_assets_prefix"* ]] \
              && [[ "${PR_HEAD#"$shared_assets_prefix"}" \
                =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] \
              && { [ "$PR_TITLE" = "chore: sync shared-assets-lit" ] \
                || [ "$PR_TITLE" = "chore: sync shared assets" ]; }
          }

          completed_guard_is_bound() {
            local current_jobs current_run guard_pages run_prefix
            case "$EVENT_NAME" in
              pull_request)
                run_prefix="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${CURRENT_RUN_ID}/job/"
                if ! guard_pages="$(
                  gh api --paginate --slurp \
                    "repos/${REPO}/commits/${PR_HEAD_SHA}/check-runs?filter=all&per_page=100"
                )"; then
                  return 1
                fi
                jq -e \
                  --arg head "$PR_HEAD_SHA" \
                  --arg run_prefix "$run_prefix" '
                  [ .[] | .check_runs[]
                    | select(.name == "Verify trusted shared-assets PR")
                    | select(.app.id == 15368 and .app.slug == "github-actions")
                    | select(.head_sha == $head)
                    | select(.details_url | startswith($run_prefix))
                  ] as $matches
                  | ($matches | length) == 1
                  and $matches[0].status == "completed"
                  and $matches[0].conclusion == "success"
                ' >/dev/null <<<"$guard_pages"
                ;;
              workflow_run)
                [[ "$DEFAULT_BRANCH" =~ ^(develop|main)$ ]]
                [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
                live_repository="$(gh api "repos/${REPO}")" || return 1
                jq -e \
                  --arg default_branch "$DEFAULT_BRANCH" \
                  --arg repository "$REPO" '
                  .full_name == $repository
                  and .default_branch == $default_branch
                ' >/dev/null <<<"$live_repository" || return 1
                live_default_branch="$(gh api \
                  "repos/${REPO}/branches/${DEFAULT_BRANCH}")" || return 1
                jq -e \
                  --arg controller_sha "$CONTROLLER_SHA" \
                  --arg default_branch "$DEFAULT_BRANCH" '
                  .name == $default_branch
                  and .protected == true
                  and .commit.sha == $controller_sha
                ' >/dev/null <<<"$live_default_branch" || return 1
                if ! current_run="$(
                  gh api "repos/${REPO}/actions/runs/${CURRENT_RUN_ID}"
                )"; then
                  return 1
                fi
                jq -e \
                  --arg api_url "$GITHUB_API_URL" \
                  --arg controller_ref "$DEFAULT_BRANCH" \
                  --arg controller_sha "$CONTROLLER_SHA" \
                  --arg repository "$REPO" \
                  --argjson run_id "$CURRENT_RUN_ID" '
                  .id == $run_id
                  and .event == "workflow_run"
                  and .path == ".github/workflows/shared-assets-guarded-automerge.yml"
                  and .head_branch == $controller_ref
                  and .head_sha == $controller_sha
                  and .run_attempt == 1
                  and .actor.login == "github-actions[bot]"
                  and .triggering_actor.login == "github-actions[bot]"
                  and .url == ($api_url + "/repos/" + $repository
                    + "/actions/runs/" + ($run_id | tostring))
                  and .status == "in_progress" and .conclusion == null
                ' >/dev/null <<<"$current_run" || return 1
                if ! current_jobs="$(
                  gh api --paginate --slurp \
                    "repos/${REPO}/actions/runs/${CURRENT_RUN_ID}/jobs?filter=all&per_page=100"
                )"; then
                  return 1
                fi
                jq -e \
                  --arg controller_sha "$CONTROLLER_SHA" '
                  [ .[] | .jobs[]
                    | select(.name == "Verify trusted shared-assets PR")
                  ] as $matches
                  | ($matches | length) == 1
                  and $matches[0].run_attempt == 1
                  and $matches[0].head_sha == $controller_sha
                  and ($matches[0].runner_id | type) == "number"
                  and $matches[0].runner_id > 0
                  and ($matches[0].steps | type) == "array"
                  and ($matches[0].steps | length) > 0
                  and $matches[0].status == "completed"
                  and $matches[0].conclusion == "success"
                ' >/dev/null <<<"$current_jobs"
                ;;
              *) return 1 ;;
            esac
          }

          strict_base_guard_is_enforced() {
            local branch_rules classic classic_state
            if ! branch_rules="$(
              GH_TOKEN="$POLICY_TOKEN" gh api "repos/${REPO}/rules/branches/${PR_BASE}"
            )"; then
              echo "Unable to read branch rules for ${REPO}/${PR_BASE}; administration read access may be required." >&2
              return 1
            fi
            if classic="$(
              GH_TOKEN="$POLICY_TOKEN" gh api \
                "repos/${REPO}/branches/${PR_BASE}/protection/required_status_checks" \
                2>&1
            )"; then
              classic_state=0
            else
              classic_state="$?"
            fi
            if [ "$classic_state" -ne 0 ]; then
              if grep -Fq "HTTP 404" <<<"$classic"; then
                classic='{}'
              else
                printf '%s\n' "$classic" >&2
                return 1
              fi
            fi
            jq -en \
              --argjson branch_rules "$branch_rules" \
              --argjson classic "$classic" '
              ([ $branch_rules[]
                 | select(.type == "required_status_checks")
                 | (.parameters.strict_required_status_checks_policy // false)
               ] + [($classic.strict // false)])
              | any(.[]; . == true)
            ' >/dev/null
          }

          required_checks_state() {
            local branch_rules check_runs classic classic_state context evidence pending required required_check state status_pages
            if ! branch_rules="$(
              GH_TOKEN="$POLICY_TOKEN" gh api "repos/${REPO}/rules/branches/${PR_BASE}"
            )"; then
              echo "Unable to read branch rules for ${REPO}/${PR_BASE}; administration read access may be required." >&2
              return 1
            fi
            if classic="$(
              GH_TOKEN="$POLICY_TOKEN" gh api \
                "repos/${REPO}/branches/${PR_BASE}/protection/required_status_checks" \
                2>&1
            )"; then
              classic_state=0
            else
              classic_state="$?"
            fi
            if [ "$classic_state" -ne 0 ]; then
              if grep -Fq "HTTP 404" <<<"$classic"; then
                classic='{}'
              else
                return 1
              fi
            fi
            required="$(
              jq -nc \
                --argjson branch_rules "$branch_rules" \
                --argjson classic "$classic" '
                ([ $branch_rules[]
                   | select(.type == "required_status_checks")
                   | .parameters.required_status_checks[]?
                   | {context, app_id: (.integration_id // null)}
                 ]
                 + [ $classic.checks[]? | {context, app_id} ]
                 + [ $classic.contexts[]? | {context: ., app_id: null} ])
                | unique_by([.context, .app_id])
              '
            )"
            [ "$(jq 'length' <<<"$required")" -gt 0 ] || return 1
            jq -e '
              all(.[]; .context != "Finalize exact trusted shared-assets merge")
            ' >/dev/null <<<"$required" || return 1
            if ! check_runs="$(
              gh api --paginate --slurp \
                "repos/${REPO}/commits/${PR_HEAD_SHA}/check-runs?filter=latest&per_page=100"
            )"; then
              return 1
            fi
            if ! status_pages="$(
              gh api --paginate --slurp \
                "repos/${REPO}/commits/${PR_HEAD_SHA}/statuses?per_page=100"
            )"; then
              return 1
            fi
            evidence="$(
              printf '%s\n%s\n' "$check_runs" "$status_pages" |
                jq -s '
                .[0] as $check_pages
                | .[1] as $status_pages
                |
                (([ $check_pages[] | .check_runs[] ]
                  | sort_by(.name, .app.id, .id)
                  | group_by([.name, .app.id])
                  | map(last)
                  | map({
                    context: .name,
                    app_id: (.app.id // null),
                    state: (if .status == "completed" then (.conclusion // "") else "pending" end)
                  }))
                 + ([ $status_pages[] | .[] ]
                  | sort_by(.context, .id)
                  | group_by(.context)
                  | map(last)
                  | map({
                    context: .context,
                    app_id: null,
                    state: .state
                  })))
              '
            )"
            pending=false
            while IFS= read -r required_check; do
              [ -n "$required_check" ] || continue
              context="$(jq -r .context <<<"$required_check")"
              state="$(
                jq -r \
                  --arg context "$context" \
                  --argjson app_id "$(jq '.app_id' <<<"$required_check")" '
                  [ .[] | select(.context == $context) ] as $matches
                  | (if $app_id == null then
                       ([ $matches[] | select(.app_id == null) ][0] // $matches[0])
                     else
                       [ $matches[] | select(.app_id == $app_id) ][0]
                     end).state // "missing"
                ' <<<"$evidence"
              )"
              case "$state" in
                success) ;;
                missing|pending|queued|in_progress) pending=true ;;
                *) return 1 ;;
              esac
            done < <(jq -c '.[]' <<<"$required")
            [ "$pending" = false ] || return 2
          }

          disable_auto_merge() {
            local auto_merge_enabled disable_error name owner
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            query_auto_merge() {
              gh api graphql \
                -f query="query(\$owner:String!,\$name:String!,\$number:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$number){autoMergeRequest{__typename}}}}" \
                -f owner="$owner" \
                -f name="$name" \
                -F number="$PR_NUMBER" \
                --jq '.data.repository.pullRequest.autoMergeRequest != null'
            }
            if auto_merge_enabled="$(query_auto_merge)"; then
              [ "$auto_merge_enabled" = false ] && return 0
            fi
            disable_error=""
            if ! disable_error="$(
              gh pr merge "$PR_URL" --disable-auto 2>&1
            )"; then
              :
            fi
            if ! auto_merge_enabled="$(query_auto_merge)"; then
              [ -z "$disable_error" ] || printf '%s\n' "$disable_error" >&2
              return 1
            fi
            if [ "$auto_merge_enabled" != false ]; then
              [ -z "$disable_error" ] || printf '%s\n' "$disable_error" >&2
              return 1
            fi
          }

          wait_for_required_checks() {
            local state remaining sleep_for
            local deadline
            # Count API latency inside the bounded 30-minute window and poll at
            # most once per minute to avoid secondary GitHub API rate limits.
            deadline=$((SECONDS + 1800))
            while [ "$SECONDS" -lt "$deadline" ]; do
              assert_live_safe || return 1
              completed_guard_is_bound || return 1
              if required_checks_state; then
                strict_base_guard_is_enforced || return 1
                state=0
              else
                state="$?"
              fi
              case "$state" in
                0) return 0 ;;
                2)
                  remaining=$((deadline - SECONDS))
                  [ "$remaining" -gt 0 ] || break
                  sleep_for=60
                  if [ "$remaining" -lt "$sleep_for" ]; then
                    sleep_for="$remaining"
                  fi
                  sleep "$sleep_for"
                  ;;
                *) return 1 ;;
              esac
            done
            return 1
          }

          disable_auto_merge
          if ! wait_for_required_checks; then
            disable_auto_merge
            exit 1
          fi

          disable_auto_merge
          assert_live_safe
          completed_guard_is_bound
          required_checks_state
          # GitHub re-evaluates this strict up-to-date policy atomically while
          # accepting the merge, so a concurrent base advance rejects it.
          strict_base_guard_is_enforced

          gh pr merge "$PR_URL" --merge --delete-branch \
            --match-head-commit "$PR_HEAD_SHA"

          merged_pr=""
          for _ in $(seq 1 12); do
            candidate="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
            if jq -e \
              --arg author "$PR_AUTHOR" \
              --arg base "$PR_BASE" \
              --arg head "$PR_HEAD" \
              --arg head_repo "$PR_HEAD_REPO" \
              --arg head_sha "$PR_HEAD_SHA" '
              .state == "closed" and .merged == true and .draft == false
              and .user.login == $author and .base.ref == $base
              and .head.ref == $head
              and .head.repo.full_name == $head_repo
              and .head.sha == $head_sha
              and (.merge_commit_sha | type == "string")
              and (.merge_commit_sha | test("^[0-9a-f]{40}$"))
            ' >/dev/null <<<"$candidate"; then
              merged_pr="$candidate"
              break
            fi
            sleep 5
          done
          [ -n "$merged_pr" ]
          merge_sha="$(jq -r .merge_commit_sha <<<"$merged_pr")"
          merge_commit="$(gh api "repos/${REPO}/commits/${merge_sha}")"
          jq -e \
            --arg base "$PR_BASE_SHA" \
            --arg head "$PR_HEAD_SHA" \
            --arg merge "$merge_sha" '
            .sha == $merge
            and (.parents | length) == 2
            and .parents[0].sha == $base
            and .parents[1].sha == $head
          ' >/dev/null <<<"$merge_commit"

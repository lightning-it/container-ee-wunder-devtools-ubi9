# yamllint disable rule:truthy rule:line-length
---
name: OpenSSF Scorecard

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:
  branch_protection_rule:

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: lightning-it/.github/.github/workflows/openssf-scorecard-reusable.yml@c4c82961ea76dea419be553f9a3f64de60c4cd7e
    with:
      publish_results: true

# Managed by lightning-it/shared-assets-lit.
# Do not edit downstream copies directly.
# yamllint disable rule:truthy rule:line-length
---
name: Refresh Copilot review gate

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: copilot-review-refresh-${{ github.event.pull_request.number }}
  # Review replies and thread updates can arrive as a burst. Let each tiny
  # refresher finish so canceled helper checks do not pollute the PR status.
  cancel-in-progress: false

jobs:
  refresh-canonical-gate:
    name: Refresh canonical Copilot review gate
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (
          github.event_name == 'pull_request_review' &&
          (
            (
              contains(fromJSON('["Copilot","copilot-pull-request-reviewer","copilot-pull-request-reviewer[bot]"]'), github.actor) &&
              github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
            ) ||
            contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.review.author_association)
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          (
            (
              contains(fromJSON('["Copilot","copilot-pull-request-reviewer","copilot-pull-request-reviewer[bot]"]'), github.actor) &&
              github.event.comment.user.login == 'copilot-pull-request-reviewer[bot]'
            ) ||
            contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.comment.author_association)
          )
        )
      )
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Rerun the canonical protected gate when needed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_BASE_REF}" =~ ^(develop|main)$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          runs_url="repos/${REPOSITORY}/actions/runs"
          refresh_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          neutral_pages="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"
          neutral="$(jq -c --arg head "${HEAD_SHA}" '
            [.[].check_runs[]? |
              select(.name == "Current revision review") |
              select(.app.id == 15368 and .app.slug == "github-actions") |
              select(.head_sha == $head)]
          ' <<<"${neutral_pages}")"
          neutral_count="$(jq 'length' <<<"${neutral}")"
          if [ "${neutral_count}" -gt 1 ]; then
            evidence="$(jq -cn --arg base "${BASE_SHA}" --arg head "${HEAD_SHA}" \
              '{schema:4,base_sha:$base,head_sha:$head,
                reason:"ambiguous duplicate protected review evidence"}')"
            invalidation_failed=0
            while read -r duplicate_check_id; do
              if ! [[ "${duplicate_check_id}" =~ ^[1-9][0-9]*$ ]]; then
                echo "Invalid duplicate check-run id: ${duplicate_check_id}." >&2
                invalidation_failed=1
                continue
              fi
              if ! invalidated="$(gh api --method PATCH \
                  "repos/${REPOSITORY}/check-runs/${duplicate_check_id}" \
                  -f status=completed \
                  -f conclusion=failure \
                  -f "details_url=${refresh_url}" \
                  -f 'output[title]=Current revision review invalidated' \
                  -f "output[summary]=${evidence}")"; then
                echo "Unable to invalidate duplicate check ${duplicate_check_id}." >&2
                invalidation_failed=1
                continue
              fi
              if ! jq -e \
                --arg evidence "${evidence}" \
                --arg head "${HEAD_SHA}" \
                --arg url "${refresh_url}" \
                --argjson check_id "${duplicate_check_id}" '
                  .id == $check_id
                  and .name == "Current revision review"
                  and .app.id == 15368
                  and .app.slug == "github-actions"
                  and .head_sha == $head
                  and .status == "completed"
                  and .conclusion == "failure"
                  and .details_url == $url
                  and .output.summary == $evidence
                ' <<<"${invalidated}" >/dev/null; then
                echo "Duplicate check ${duplicate_check_id} did not confirm invalidation." >&2
                invalidation_failed=1
              fi
            done < <(jq -r '.[].id' <<<"${neutral}")
            if ! verified_pages="$(gh api --paginate --slurp \
                "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"; then
              echo "Unable to re-read duplicate protected checks after invalidation." >&2
              invalidation_failed=1
            elif ! jq -e \
              --arg evidence "${evidence}" \
              --arg head "${HEAD_SHA}" \
              --arg url "${refresh_url}" \
              --argjson expected "${neutral}" '
                [.[].check_runs[]? |
                  select(.name == "Current revision review") |
                  select(.app.id == 15368 and .app.slug == "github-actions") |
                  select(.head_sha == $head)] as $current |
                ([$current[].id] | sort) == ([$expected[].id] | sort)
                and ($current | length) == ($expected | length)
                and all($current[];
                  .status == "completed"
                  and .conclusion == "failure"
                  and .details_url == $url
                  and .output.summary == $evidence)
              ' <<<"${verified_pages}" >/dev/null; then
              echo "Not every duplicate protected check is verifiably invalidated." >&2
              invalidation_failed=1
            fi
            if [ "${invalidation_failed}" -ne 0 ]; then
              echo "Duplicate-check invalidation was incomplete; remaining fail-closed." >&2
            fi
            echo "Multiple protected Current revision review checks exist for ${HEAD_SHA}." >&2
            exit 1
          fi
          if [ "${neutral_count}" -eq 1 ]; then
            check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${neutral}")"
            check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
            # Managed distribution has its own evidence kind. The sync App may
            # never satisfy the Copilot branch, and inside lightning-it/.github
            # it is accepted only as ancestry-backmerge.
            if ! jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg base "${BASE_SHA}" \
              --arg head "${HEAD_SHA}" \
              --arg pr "${PR_NUMBER}" \
              --arg base_ref "${PR_BASE_REF}" \
              --arg repository "${REPOSITORY}" \
              --argjson pr_number "${PR_NUMBER}" \
              --arg url "${check_url}" '
                .[0] as $check
                | ($check.output.summary | fromjson) as $summary
                | $check.status == "completed"
                and $check.conclusion == "success"
                and $check.details_url == $url
                and $summary.schema == 4
                and $summary.base_sha == $base
                and $summary.head_sha == $head
                and (
                  (
                    (
                      (($author != "lightning-it-release-automation[bot]"
                        and $author != "lightning-it-shared-assets-sync[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:copilot:v6:" + $pr
                            + ":[1-9][0-9]*:" + $base + ":" + $head + "$")))
                      or
                      (($author == "lightning-it-shared-assets-sync[bot]"
                        and $repository != "lightning-it/.github"
                        and $base_ref == "develop")
                        and $summary.review_path
                          == "deterministic provenance-bound managed distribution exemption"
                        and ($check.external_id |
                          test("^mlx90-current-revision:managed-sync:v6:" + $pr
                            + ":[1-9][0-9]*:" + $base + ":" + $head + "$")))
                      or
                      (($repository == "lightning-it/.github"
                        and $author == "lightning-it-shared-assets-sync[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:ancestry-backmerge:v6:"
                            + $pr + ":[1-9][0-9]*:" + $base + ":" + $head + "$")))
                    )
                    and $summary.pull_request_number == $pr_number
                  )
                  or
                  (
                    (
                      (($author != "lightning-it-release-automation[bot]"
                        and $author != "lightning-it-shared-assets-sync[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:copilot:v5:[1-9][0-9]*:"
                            + $base + ":" + $head + "$")))
                      or
                      (($repository == "lightning-it/.github"
                        and $author == "lightning-it-shared-assets-sync[bot]")
                        and ($check.external_id |
                          test("^mlx90-current-revision:ancestry-backmerge:v5:"
                            + "[1-9][0-9]*:" + $base + ":" + $head + "$")))
                      or
                      ($author == "lightning-it-release-automation[bot]"
                        and ($check.external_id |
                          test("^mlx90-current-revision:v4:[1-9][0-9]*:[0-9a-f]{64}$")))
                    )
                    and $summary.pull_request_number == $pr_number
                  )
                )
              ' <<<"${neutral}" >/dev/null; then
              echo "Existing neutral result is stale or malformed; canonical rerun required."
              evidence="$(jq -cn --arg base "${BASE_SHA}" --arg head "${HEAD_SHA}" \
                '{schema:4,base_sha:$base,head_sha:$head,
                  reason:"stale or malformed review evidence"}')"
              gh api --method PATCH "repos/${REPOSITORY}/check-runs/${check_id}" \
                -f status=completed \
                -f conclusion=failure \
                -f "details_url=${check_url}" \
                -f 'output[title]=Current revision review invalidated' \
                -f "output[summary]=${evidence}" >/dev/null
              neutral_count=0
            fi

          fi
          if [ "${neutral_count}" -eq 1 ]; then
            read -r owner name <<<"${REPOSITORY//\// }"
            # shellcheck disable=SC2016  # GraphQL variables must stay literal.
            query='query($owner:String!,$name:String!,$number:Int!,$after:String){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{isResolved comments(first:100){pageInfo{hasNextPage} nodes{author{login} pullRequestReview{commit{oid}}}}}}}}}'
            threads='[]'
            after=''
            while true; do
              args=(-f query="${query}" -F owner="${owner}" -F name="${name}" -F number="${PR_NUMBER}")
              if [ -n "${after}" ]; then args+=(-f after="${after}"); fi
              page="$(gh api graphql "${args[@]}")"
              page_threads="$(jq '.data.repository.pullRequest.reviewThreads.nodes' <<<"${page}")"
              threads="$(jq -c --argjson page "${page_threads}" '. + $page' <<<"${threads}")"
              if [ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"${page}")" != true ]; then break; fi
              after="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty' <<<"${page}")"
              test -n "${after}"
            done
            incomplete="$(jq '[.[] |
              select(.isResolved == false) |
              select(.comments.pageInfo.hasNextPage == true)] | length' <<<"${threads}")"
            if [ "${incomplete}" -gt 0 ]; then
              evidence="$(jq -cn --arg base "${BASE_SHA}" --arg head "${HEAD_SHA}" \
                '{schema:4,base_sha:$base,head_sha:$head,
                  reason:"incomplete unresolved review-thread pagination"}')"
              gh api --method PATCH "repos/${REPOSITORY}/check-runs/${check_id}" \
                -f status=completed \
                -f conclusion=failure \
                -f "details_url=${check_url}" \
                -f 'output[title]=Current revision review invalidated' \
                -f "output[summary]=${evidence}" >/dev/null
              echo "Unresolved review-thread comments exceed the verified page; refusing to preserve PASS." >&2
              exit 1
            fi
            unresolved="$(jq --arg head "${HEAD_SHA}" '[.[] |
              select(.isResolved == false) |
              select(any(.comments.nodes[];
                (.author.login == "copilot-pull-request-reviewer"
                  or .author.login == "copilot-pull-request-reviewer[bot]")
                and .pullRequestReview.commit.oid == $head))] | length' <<<"${threads}")"
            if [ "${unresolved}" -gt 0 ]; then
              evidence="$(jq -cn --arg base "${BASE_SHA}" --arg head "${HEAD_SHA}" \
                '{schema:4,base_sha:$base,head_sha:$head,
                  reason:"unresolved current-head Copilot findings"}')"
              gh api --method PATCH "repos/${REPOSITORY}/check-runs/${check_id}" \
                -f status=completed \
                -f conclusion=failure \
                -f "details_url=${check_url}" \
                -f 'output[title]=Current revision review invalidated' \
                -f "output[summary]=${evidence}" >/dev/null
              echo "Current-head Copilot findings invalidate the neutral PASS." >&2
              exit 1
            fi
            echo "The exact current-head neutral PASS remains valid; no rerun is needed."
            exit 0
          fi

          for attempt in $(seq 1 10); do
            response="$(gh api "${runs_url}?event=pull_request_target&head_sha=${HEAD_SHA}&per_page=100")"
            run="$(
              jq -c --arg head_sha "${HEAD_SHA}" --argjson pr "${PR_NUMBER}" '
                [
                  .workflow_runs[]?
                  | select(.head_sha == $head_sha)
                  | select(.path == ".github/workflows/copilot-review.yml")
                  | select(any(.pull_requests[]?; .number == $pr))
                ]
                | sort_by(.run_number)
                | reverse
                | .[0] // empty
              ' <<<"${response}"
            )"

            if [ -n "${run}" ]; then
              run_id="$(jq -r '.id' <<<"${run}")"
              status="$(jq -r '.status' <<<"${run}")"
              if [ "${status}" = "completed" ]; then
                gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/rerun"
                echo "Rerun requested for canonical Copilot gate ${run_id}."
              else
                echo "Canonical Copilot gate ${run_id} is ${status}; its polling loop will observe the review event."
              fi
              exit 0
            fi

            echo "Canonical gate not visible yet (attempt ${attempt}/10)."
            sleep 6
          done

          echo "No canonical pull_request_target gate found for PR #${PR_NUMBER} at ${HEAD_SHA}." >&2
          exit 1

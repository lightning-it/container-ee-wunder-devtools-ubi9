# yamllint disable rule:truthy rule:line-length
---
name: Container Fuzzing

on:
  pull_request:
    paths:
      - "Containerfile"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/fuzz/**"
  push:
    branches: ["develop", "main", "master"]
    paths:
      - "Containerfile"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/fuzz/**"
  schedule:
    - cron: "17 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fast-check container policy fuzzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FUZZ_RUNS: ${{ github.event_name == 'schedule' && '10000' || '1000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run container fuzz tests
        run: npm run test:fuzz
